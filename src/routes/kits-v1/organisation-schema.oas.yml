openapi: 3.1.0
info:
  title: Organisation API
  description: API for organisation-related operations
  version: '1.0.0'
  license:
    name: 'Open Government Licence v3.0'
    url: 'https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3'
tags:
  - name: 'organisation'
    description: 'Operations related to organisation management'
security:
  - mTLS: []
servers:
  - url: 'https://chs-upgrade-api.ruraldev.org.uk:8446/extapi'
    description: The test server for KITS/V1 APIs
paths:
  /organisation/{organisationId}:
    get:
      tags:
        - 'organisation'
      summary: 'Find an Organisation.'
      description: 'Request to get details for an organisation with a specified ID.'
      operationId: 'getByPartyId'
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'organisationId'
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            examples: [100000000, 111111111, 222222222]
      responses:
        '200':
          description: 'Returns full organisation details.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  _data:
                    $ref: '#/components/schemas/OrganisationWithAllResponse'
                required:
                  - '_data'
                additionalProperties: false
        '400':
          description: 'The organisationId must have 10 or more digits'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: 'HTTP 400 Bad Request'
        '403':
          description: >
            Getting an organisation's details is forbidden, or a WAF rule has been triggered.
          content:
            text/html:
              schema:
                type: string
              examples:
                forbidden:
                  summary: Forbidden HTML response
                  value: |
                    <html><body><h1>403 Forbidden</h1>
                    Request forbidden by administrative rules.
                    </body></html>
        '404':
          description: 'organisation details not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /organisation/search:
    post:
      tags:
        - 'organisation'
      summary: 'Search for an organisation.'
      description: >
        Search for an organisation by SBI, business name, or business postcode.
      operationId: 'searchOrganisation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequestBody'
      responses:
        '200':
          description: 'Returns a list of Organisations with a paging object.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  _data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganisationWithAddressResponse'
                  _page:
                    $ref: '#/components/schemas/Page'
                required:
                  - '_data'
                  - '_page'
        '400':
          description: >
            The `primarySearchPhrase` is shorter than the minimum length for the selected `searchFieldType`, or the `searchFieldType` is not recognised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: 'Internal server error, or only `searchFieldType` was provided.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /organisation/{organisationId}/lock:
    post:
      tags:
        - 'organisation'
      summary: 'Lock Organisation.'
      description: 'Request to Lock an Organisation by party Id.'
      operationId: 'lockOrganisation'
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'organisationId'
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            examples: [100000000, 111111111, 222222222]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockRequestBody'
      responses:
        '204':
          description: 'Successfully locked Organisation'
        '400':
          description: 'Invalid reason and notes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '403':
          description: >
            Locking an organisation is forbidden, or a WAF rule has been triggered.
          content:
            text/html:
              schema:
                type: string
              examples:
                forbidden:
                  summary: Forbidden HTML response
                  value: |
                    <html><body><h1>403 Forbidden</h1>
                    Request forbidden by administrative rules.
                    </body></html>
        '404':
          description: 'organisation not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: 'organisationId must not be empty'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /organisation/{organisationId}/unlock:
    post:
      tags:
        - 'organisation'
      summary: 'unlock Organisation.'
      description: 'Request to unlock an Organisation by party Id.'
      operationId: 'unlockOrganisation'
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'organisationId'
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            examples: [100000000, 111111111, 222222222]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockRequestBody'
      responses:
        '204':
          description: 'Successfully unlocked Organisation'
        '400':
          description: 'Invalid reason and notes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '403':
          description: >
            Unlocking an organisation is forbidden, or a WAF rule has been triggered.
          content:
            text/html:
              schema:
                type: string
              examples:
                forbidden:
                  summary: Forbidden HTML response
                  value: |
                    <html><body><h1>403 Forbidden</h1>
                    Request forbidden by administrative rules.
                    </body></html>
        '404':
          description: 'organisation not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: 'organisationId must not be empty'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /SitiAgriApi/authorisation/organisation/{orgId}/authorisation:
    post:
      tags:
        - 'organisation'
        - 'authorisation'
      summary: 'Add a person to a business (create authorisation).'
      description: >
        Link an existing person to an organisation with roles and privileges. Every entry must be
        for the same person; the person is linked once per role, each link with the privileges
        from every `personPrivileges` entry.
      operationId: 'createAuthorisation'
      parameters:
        - name: 'orgId'
          in: 'path'
          required: true
          description: >
            Must be 1-20 digits (leading zeros count towards the length); anything else is
            rejected upstream with a 403 before the request body is read.
          schema:
            type: string
            pattern: '^[0-9]{1,20}$'
            examples: ['111111111']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorisationCreateRequest'
            example:
              personRoles:
                - role: 'Helper'
                  personId: 11111111
              personPrivileges:
                - personId: 11111111
                  privilegeNames:
                    - 'View - business'
                    - 'Amend - land'
                    - 'Amend - entitlement'
                    - 'Submit - bps'
      responses:
        '200':
          description: 'Authorisation created.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: 'null'
                  success:
                    type: boolean
                    example: true
                  errorString:
                    type: 'null'
                required: ['data', 'success']
        '400':
          description: >
            Invalid payload. Malformed JSON or unrecognised fields are rejected by the upstream
            JSON deserialiser before validation, returning the raw error message as plain text.
            A body naming more than one person is reported as `An error has occurred.`, before
            the person or organisation is looked up.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UpstreamError'
                  - $ref: '#/components/schemas/BadRequest'
            text/plain:
              schema:
                type: string
        '403':
          description: >
            The `orgId` is not 1-20 digits. Upstream reports this validation failure as a 403.
          content:
            text/html:
              schema:
                type: string
              examples:
                forbidden:
                  summary: Forbidden HTML response
                  value: |
                    <html><body><h1>403 Forbidden</h1>
                    Request forbidden by administrative rules.
                    </body></html>
        '404':
          description: >
            `Person not found.` when a `personId` in the body does not exist, otherwise `Organisation not found.`
            when the `orgId` does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamError'
              example:
                data: null
                success: false
                errorString: 'Person not found.'
        '409':
          description: >
            `Relation already exists` when the person is already linked to the organisation or
            `personRoles` repeats a role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamError'
              example:
                data: null
                success: false
                errorString: 'Relation already exists'
        '500':
          description: >
            No request body, a body missing `personRoles` or `personPrivileges`, an empty
            `personRoles`, or an entry without a `personId`. Upstream reports these validation
            failures as a 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamError'

  /SitiAgriApi/authorisation/organisation/{orgId}/authorisation/person/{personId}:
    put:
      tags:
        - 'organisation'
        - 'authorisation'
      summary: "Update a person's authorisation on a business."
      description: >
        Set a person's roles and privileges on a business, linking them if they are not yet
        linked. The person gets a link per role sent, replacing their existing roles, each link
        with the privileges from every `personPrivileges` entry. Empty `personRoles` and
        `personPrivileges` arrays remove the person from the business.
      operationId: 'updateAuthorisation'
      parameters:
        - name: 'orgId'
          in: 'path'
          required: true
          description: >
            Must be 1-20 digits (leading zeros count towards the length); anything else is
            rejected upstream with a 403 before the request body is read.
          schema:
            type: string
            pattern: '^[0-9]{1,20}$'
            examples: ['111111111']
        - name: 'personId'
          in: 'path'
          required: true
          schema:
            type: integer
            examples: [11111111]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorisationUpdateRequest'
            example:
              personRoles:
                - role: 'Helper'
                  personId: 11111111
              personPrivileges:
                - personId: 11111111
                  privilegeNames:
                    - 'View - business'
                    - 'Amend - land'
                    - 'Amend - entitlement'
                    - 'Submit - bps'
      responses:
        '200':
          description: 'Authorisation updated.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: 'null'
                  success:
                    type: boolean
                    example: true
                  errorString:
                    type: 'null'
                required: ['data', 'success']
        '400':
          description: >
            Invalid payload. Malformed JSON or unrecognised fields are rejected by the upstream
            JSON deserialiser before validation, returning the raw error message as plain text.
            A body missing `personRoles` or `personPrivileges` returns `An error has occurred.`
            (only once the organisation and person have been found; otherwise a 404).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/UpstreamError'
                  - $ref: '#/components/schemas/BadRequest'
            text/plain:
              schema:
                type: string
        '403':
          description: >
            The `orgId` is not 1-20 digits. Upstream reports this validation failure as a 403.
          content:
            text/html:
              schema:
                type: string
              examples:
                forbidden:
                  summary: Forbidden HTML response
                  value: |
                    <html><body><h1>403 Forbidden</h1>
                    Request forbidden by administrative rules.
                    </body></html>
        '404':
          description: >
            `Organisation not found.` when the `orgId` does not exist.
            `Person not found.` when the person does not exist or a `personId`
            in the body differs from the `personId` in the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamError'
              example:
                data: null
                success: false
                errorString: 'Person not found.'
            text/html:
              schema:
                type: string
        '409':
          description: >
            `Relation already exists` when `personRoles` repeats a role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamError'
              example:
                data: null
                success: false
                errorString: 'Relation already exists'
        '500':
          description: >
            No request body, or a `personRoles`/`personPrivileges` entry without a `personId`.
            Upstream reports these validation failures as a 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamError'

  /organisation/{organisationId}/deactivate:
    post:
      tags:
        - 'organisation'
      summary: 'The ability for an internal user to deactivate (soft delete) a business (organisation) record.'
      description: 'Request to deactivate an Organisation by party Id.'
      operationId: 'deactivateOrganisation'
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'organisationId'
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            examples: [1000000000, 1111111111, 2222222222]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateRequestBody'
      responses:
        '204':
          description: 'Successfully deactivated Organisation'
        '400':
          description: 'Invalid reason and notes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '403':
          description: 'Invalid organisationId.'
          content:
            text/html:
              schema:
                type: string
              examples:
                forbidden:
                  summary: Forbidden HTML response
                  value: |
                    <html><body><h1>403 Forbidden</h1>
                    Request forbidden by administrative rules.
                    </body></html>
        '404':
          description: 'organisation not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: >
            Error processing the request to deactivate an organisation.
            Reason exceeds 100 characters, note exceeds 4000 characters,
            organisationId not found,
            or the upstream fails to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
  /organisation/{organisationId}/reactivate:
    post:
      tags:
        - 'organisation'
      summary: 'The ability for an internal user to reactivate a business (organisation) record.'
      description: 'Request to reactivate a locked and deactivated Organisation by party Id.'
      operationId: 'reactivateOrganisation'
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'organisationId'
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            examples: [1000000000, 1111111111, 2222222222]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactivateRequestBody'
      responses:
        '204':
          description: 'Successfully reactivated Organisation'
        '400':
          description: 'Invalid reason and notes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '403':
          description: 'Invalid organisationId.'
          content:
            text/html:
              schema:
                type: string
              examples:
                forbidden:
                  summary: Forbidden HTML response
                  value: |
                    <html><body><h1>403 Forbidden</h1>
                    Request forbidden by administrative rules.
                    </body></html>
        '500':
          description: >
            Error processing the request to reactivate an organisation.
            Organisation is not locked and deactivated, organisationId not found,
            or the upstream fails to process the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationError'
components:
  schemas:
    # request objects
    SearchRequestBody:
      type: object
      description: >
        Search for an organisation by one of the options. The required length of `primarySearchPhrase` depends on the chosen `searchFieldType`:
          - `SBI` - the full 9-digit SBI; returns 0 or 1 results.
          - `BUSINESS_NAME` - partial business name, at least 2 characters; returns 0 or more results.
          - `BUSINESS_POSTCODE` - full business postcode, at least 5 characters; returns 0 or more results.
      oneOf:
        - title: 'Search by SBI'
          properties:
            searchFieldType:
              type: string
              enum:
                - 'SBI'
            primarySearchPhrase:
              oneOf:
                - type: string
                  minLength: 9
                - type: integer
                  minimum: 100000000
                  description: 'If the SBI is a number it must have at least 9 digits.'
                  # This is because the upstream checks the character length of the number.
                  # Unfortunately the upstream accepts any `number`, but this is the closest we can
                  # replicate the type-space in this schema!
                  # PAY ATTENTION when acceptance testing this schema against the upstream, as negative
                  # numbers, rationals, and exponents will be flagged as false negatives!!!
          required:
            - 'searchFieldType'
            - 'primarySearchPhrase'
        - title: 'Search by business name'
          properties:
            searchFieldType:
              type: string
              enum:
                - 'BUSINESS_NAME'
            primarySearchPhrase:
              oneOf:
                - type: string
                  minLength: 2
                - type: integer
                  minimum: 10
          required:
            - 'searchFieldType'
            - 'primarySearchPhrase'
        - title: 'Search by business postcode'
          properties:
            searchFieldType:
              type: string
              enum:
                - 'BUSINESS_POSTCODE'
            primarySearchPhrase:
              oneOf:
                - type: string
                  minLength: 5
                - type: integer
                  minimum: 10000
          required:
            - 'searchFieldType'
            - 'primarySearchPhrase'
      examples:
        - searchFieldType: 'SBI'
          primarySearchPhrase: '100000000'
        - searchFieldType: 'SBI'
          primarySearchPhrase: '111111111'
        - searchFieldType: 'SBI'
          primarySearchPhrase: '222222222'
        - searchFieldType: 'BUSINESS_NAME'
          primarySearchPhrase: 'Farm'
        - searchFieldType: 'BUSINESS_POSTCODE'
          primarySearchPhrase: 'AB12 3CD'
    LockRequestBody:
      type: object
      examples:
        - partyNoteType: 'LockOrganisation'
          reason: 'Business Structure Changes'
        - partyNoteType: 'LockOrganisation'
          note: 'testing locking'
        - partyNoteType: 'LockOrganisation'
          note: 'testing locking'
          reason: 'Business Structure Changes'
      anyOf:
        - properties:
            partyNoteType:
              type: string
              enum:
                - 'LockOrganisation'
            reason:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                  minLength: 1
            note:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                - type: 'null'
          required: ['partyNoteType', 'reason']
        - properties:
            partyNoteType:
              type: string
              enum:
                - 'LockOrganisation'
            note:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                  minLength: 1
            reason:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                - type: 'null'
          required: ['partyNoteType', 'note']
    AuthorisationCreateRequest:
      type: object
      additionalProperties: false
      required: ['personRoles', 'personPrivileges']
      properties:
        personRoles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: ['personId']
            properties:
              role:
                type: string
              personId:
                type: integer
        personPrivileges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: ['personId']
            properties:
              personId:
                type: integer
              privilegeNames:
                type: array
                items:
                  type: string
    AuthorisationUpdateRequest:
      $ref: '#/components/schemas/AuthorisationCreateRequest'
    UnlockRequestBody:
      type: object
      examples:
        - partyNoteType: 'UnlockOrganisation'
          note: 'testing unlocking'
        - partyNoteType: 'UnlockOrganisation'
          reason: 'Business Structure Changes'
        - partyNoteType: 'UnlockOrganisation'
          reason: 'Business Structure Changes'
          note: 'testing unlocking'
      anyOf:
        - properties:
            partyNoteType:
              type: string
              enum:
                - 'UnlockOrganisation'
            reason:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                  minLength: 1
            note:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                - type: 'null'
          required: ['partyNoteType', 'reason']
        - properties:
            partyNoteType:
              type: string
              enum:
                - 'UnlockOrganisation'
            note:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                  minLength: 1
            reason:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                - type: 'null'
          required: ['partyNoteType', 'note']
    DeactivateRequestBody:
      type: object
      examples:
        - partyNoteType: 'DeactivateOrganisation'
          note: 'testing deactivation'
        - partyNoteType: 'DeactivateOrganisation'
          reason: 'Business Structure Changes'
        - partyNoteType: 'DeactivateOrganisation'
          reason: 'Business Structure Changes'
          note: 'testing deactivation'
      anyOf:
        - properties:
            partyNoteType:
              type: string
              enum:
                - 'DeactivateOrganisation'
            reason:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                  minLength: 1
            note:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                - type: 'null'
          required: ['partyNoteType', 'reason']
        - properties:
            partyNoteType:
              type: string
              enum:
                - 'UnlockOrganisation'
            note:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                  minLength: 1
            reason:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                - type: 'null'
          required: ['partyNoteType', 'note']

    ReactivateRequestBody:
      type: object
      examples:
        - partyNoteType: 'ReactivateOrganisation'
          note: 'testing reactivation'
        - partyNoteType: 'ReactivateOrganisation'
          reason: 'Business Structure Changes'
        - partyNoteType: 'ReactivateOrganisation'
          reason: 'Business Structure Changes'
          note: 'testing reactivation'
      anyOf:
        - properties:
            partyNoteType:
              type: string
              enum:
                - 'ReactivateOrganisation'
            reason:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                  minLength: 1
            note:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                - type: 'null'
          required: ['partyNoteType', 'reason']
        - properties:
            partyNoteType:
              type: string
              enum:
                - 'ReactivateOrganisation'
            note:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                  minLength: 1
            reason:
              oneOf:
                - type: number
                - type: boolean
                - type: string
                - type: 'null'
          required: ['partyNoteType', 'note']

    # response objects
    TypeWithId:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        type:
          type: string
      required:
        - 'id'
        - 'type'
    AssociatedPersonResponse:
      # NOTE: this data never seems to be populated
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        telephoneNumber:
          type: string
        dateOfBirth:
          type: string
          format: 'date-time'
        percentageOfBusinessOwned:
          type: integer
        datePersonBecameOwner:
          type: string
          format: 'date-time'
        nationalInsuranceNumber:
          type: string
        role:
          type: string
        headOfHolding:
          type: boolean
        dateBecameHeadOfHolding:
          type: string
          format: 'date-time'
        hasOtherBusinessInterests:
          type: boolean
        hasBeenHeadOfHoldingForOtherBusiness:
          type: boolean
        percentageOfVotingRights:
          type: integer
    OrganisationWithAddressResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        name:
          type: string
        sbi:
          type: integer
          format: 'int64'
        additionalSbiIds:
          type: array
          items:
            type: integer
            format: 'int64'
        confirmed:
