  /lms/organisation/{organisationId}/parcel/sheet-id/{sheetId}/parcel-id/{parcelId}/land-covers:
    get:
      tags:
        - parcel
      summary: Get land covers for a parcel (optionally with geometries)
      operationId: getParcelLandCovers
      description: |
        Returns land covers for a parcel as a GeoJSON feature collection. Each feature
