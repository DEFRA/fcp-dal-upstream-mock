        - system
      summary: Get parcels by parcel reference list (internal system endpoint)
      operationId: getParcelsByReferences
      description: |
        Accepts a list of parcel references (sheetId + parcelId pairs) and returns matching
        parcel details. Annotated `@CapdSystemProcessEndpoint` — not for direct portal use.
        Calls `organisationService.getParcels(parcelReferences)`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ParcelReference'
      responses:
        '200':
          description: Parcels matching the provided references
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParcelNoGeometry'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    organisationId:
      name: organisationId
      in: path
      required: true
      description: Internal organisation identifier (Long)
      schema:
        type: integer
        format: int64
    callerId:
      name: callerId
      in: header
      required: true
      description: |
        Identifier of the calling user (BigInteger). Used for VIEWLAND authorisation check
        via `@CapdOrganisationAuthorisation`.
      schema:
        type: integer
    userType:
      name: userType
      in: header
      required: true
      description: |
        User type classification. Used with `callerId` to resolve business reference and
        perform VIEWLAND authorisation.
      schema:
        type: string
        enum:
          - internal
          - external
          - ida_no_match
    historicDate:
      name: historicDate
      in: path
      required: true
      description: |
        Date for historical data retrieval. Parsed by `LmsDateUtils`. Format: ISO 8601
        date string (e.g. `2022-01-20`).
      schema:
        type: string
        example: '2022-01-20'
    sheetId:
      name: sheetId
      in: path
      required: true
      description: OS map sheet identifier
      schema:
        type: string
    parcelId:
      name: parcelId
      in: path
      required: true
      description: Parcel identifier within the OS sheet
      schema:
        type: string

  responses:
    NotFound:
      description: |
        Resource not found. Body is plain text (`NotFoundExceptionMapper`).
        For parcel lookups: "Parcel {sheetId}{parcelId} not found"
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: Unexpected service error
      content:
        application/json:
          schema:
            type: object

  schemas:
    ParcelNoGeometry:
      type: object
      x-validation-source: ParcelNoGeometry.java (entity)
      description: |
        Land parcel record without geometry. Stored in LMS database.
        `validFrom`/`validTo` are `@Transient` (not in DB, populated from queries).
      properties:
        id:
          type: integer
          description: Unique parcel identifier (BigInteger)
        sheetId:
          type: string
          description: OS map sheet identifier
        parcelId:
          type: string
          description: Parcel identifier within the sheet
        area:
          type: number
          description: Parcel area (typically in hectares)
        pendingDigitisation:
          type: boolean
          description: True if the parcel is awaiting digitisation. Defaults to false.
        validFrom:
          type: string
          description: Parcel validity start date (transient — from query)
        validTo:
          type: string
          description: Parcel validity end date (transient — from query)

    ParcelDetails:
      type: object
      x-validation-source: ParcelDetails.java
      description: Detailed parcel record with explicit validity dates.
      properties:
        sheetId:
          type: string
        parcelId:
          type: string
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date

    ParcelWithGeometryDTO:
      type: object
      x-validation-source: ParcelWithGeometryDTO.java
      description: |
        GeoJSON Feature representing a parcel with full geometry. The `properties` map
        contains: sheetId, parcelId, area (as string), pendingDigitisation (as string).
        `type` is hardcoded as "Feature".
      properties:
        id:
          type: integer
          description: Unique parcel identifier
        type:
          type: string
          description: GeoJSON type (always "Feature")
          example: Feature
        geometry:
          $ref: '#/components/schemas/GeoJsonGeometry'
        properties:
          type: object
          description: |
            Feature properties map. Keys: sheetId, parcelId, area, pendingDigitisation.
          additionalProperties:
            type: string

    LandSummary:
      type: object
      x-validation-source: LandSummary.java
      description: Aggregated land summary for Business Overview.
      properties:
        totalParcels:
          type: integer
          description: Total number of parcels
        totalArea:
          type: number
          description: Total land area across all parcels (in hectares)

    EligibleLandCoversInfo:
      type: object
      x-validation-source: EligibleLandCoversInfo.java
      description: |
        Land cover area information for a parcel or group. `id` is the parcel/group identifier,
        `info` is a list of land cover area breakdowns.
      properties:
        id:
          type: string
          description: Parcel ID, group ID, or other identifier
        info:
          type: array
          items:
            $ref: '#/components/schemas/AreaInfo'

    AreaInfo:
      type: object
      x-validation-source: EligibleLandCoversInfo.AreaInfo (nested class)
      description: Land cover area breakdown entry.
      properties:
        code:
          type: string
          description: Land cover classification code
        name:
          type: string
          description: Land cover type name
        area:
          type: number
          description: Area of this land cover type (in hectares)

    SingleLandCover:
      type: object
      x-validation-source: SingleLandCover.java
      description: Parcel with a single land cover type. Extends ParcelNoGeometry.
      allOf:
        - $ref: '#/components/schemas/ParcelNoGeometry'
        - type: object
          properties:
            areaCode:
              type: string
              description: Land cover type classification code
            areaName:
              type: string
              description: Land cover type name

    NationalCharacterArea:
      type: object
      x-validation-source: NationalCharacterArea.java
      description: A National Character Area associated with the organisation's land.
      properties:
        code:
          type: string
          description: NCA code identifier
        name:
          type: string
          description: NCA name
        statementOfPrioritiesURL:
          type: string
          description: URL to the NCA statement of priorities document

    Centroid:
      type: object
      x-validation-source: Centroid.java
      description: 2D coordinate centroid point for a parcel.
      properties:
        x:
          type: number
          description: X coordinate (longitude / easting)
        y:
          type: number
          description: Y coordinate (latitude / northing)

    ParcelReference:
      type: object
      x-validation-source: ParcelReference.java
      description: A reference to a specific parcel used for batch parcel lookup.
      properties:
        sheetId:
          type: string
          description: OS map sheet identifier
        parcelId:
          type: string
          description: Parcel identifier

    GeoJsonGeometry:
      type: object
      x-schema-incomplete: true
      description: |
        JTS Geometry serialised as GeoJSON. Type may be Polygon, MultiPolygon, Point, etc.
        Exact structure depends on the parcel geometry stored in LMS.
      properties:
        type:
          type: string
          example: Polygon
        coordinates:
          type: array
          description: GeoJSON coordinate array (structure depends on type)
          items: {}

    CapdFeatureCollectionParcel:
      type: object
      description: GeoJSON-style feature collection of parcel geometries.
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/ParcelWithGeometryDTO'

    CapdFeatureCollectionLandCovers:
      type: object
      description: GeoJSON-style feature collection of land cover features.
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/LandCoverDTO'

    CapdFeatureCollectionLandCoverGeometry:
      type: object
      description: GeoJSON-style feature collection of land cover geometry-only features.
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/LandCoverGeometryOnly'

    CapdFeatureCollectionGroupCentroids:
      type: object
      description: GeoJSON-style feature collection of group centroids.
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/GroupWithCentroidDTO'

    LandCoverDTO:
      type: object
      x-validation-source: LandCoverDTO.java
      description: |
        GeoJSON Feature for a land cover entry. `properties` map contains: code, name,
        area (as string), isBpsEligible (as string). `geometry` may be null if
        `includeGeometries=false`.
      properties:
        id:
          type: number
          description: Unique land cover identifier
        type:
          type: string
          description: GeoJSON type (always "Feature")
          example: Feature
        geometry:
          $ref: '#/components/schemas/GeoJsonGeometry'
        properties:
          type: object
          description: |
            Land cover properties map. Keys: code, name, area, isBpsEligible.
          additionalProperties:
            type: string

    LandCoverGeometryOnly:
      type: object
      x-validation-source: LandCoverGeometryOnly.java
      description: GeoJSON Feature with only the geometry (no properties).
      properties:
        id:
          type: integer
          description: Unique land cover identifier
        type:
          type: string
          description: GeoJSON type (always "Feature")
          example: Feature
        geometry:
          $ref: '#/components/schemas/GeoJsonGeometry'

    GroupWithCentroidDTO:
      type: object
      x-validation-source: GroupWithCentroidDTO.java
      description: |
        GeoJSON Feature representing a parcel group centroid. `properties` map
        contains featureCount (number of parcels in the group, as string).
      properties:
        groupId:
          type: string
          description: Parcel group identifier
        type:
          type: string
          description: GeoJSON type (always "Feature")
          example: Feature
        geometry:
          $ref: '#/components/schemas/GeoJsonGeometry'
        properties:
          type: object
          description: Group properties. Keys include featureCount.
          additionalProperties:
            type: string
