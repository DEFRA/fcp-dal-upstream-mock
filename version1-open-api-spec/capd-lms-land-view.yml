        '500':
          $ref: '#/components/responses/InternalError'

  /lms/organisation/{organisationId}/parcel/sheet-id/{sheetId}/parcel-id/{parcelId}/historic/{historicDate}/land-covers:
    get:
      tags:
        - parcel
      summary: Get land covers for a parcel at a historic date
      operationId: getParcelLandCoversHistoric
      description: |
        Returns land covers for a parcel at `historicDate`. Calls
        `parcelService.getParcelLandCovers(sheetId, parcelId, historicDate, includeGeometries)`.

        **Authorization**: VIEWLAND required.
      parameters:
        - $ref: '#/components/parameters/organisationId'
        - $ref: '#/components/parameters/sheetId'
        - $ref: '#/components/parameters/parcelId'
        - $ref: '#/components/parameters/historicDate'
        - name: includeGeometries
          in: query
          required: false
          description: Whether to include geometry data. Default false.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
      responses:
        '200':
          description: Land cover feature collection at historic date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapdFeatureCollectionLandCovers'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /lms/organisation/{organisationId}/parcel/sheet-id/{sheetId}/parcel-id/{parcelId}/land-covers/geometries:
    get:
      tags:
        - parcel
      summary: Get land cover geometries only for a parcel
      operationId: getParcelLandCoverGeometries
      description: |
        Returns land cover feature geometries (no attributes) for a parcel. Calls
        `spatialService.getLandCoversFeatures(sheetId, parcelId)`.

        **HTTP 204**: Returned when no land cover features exist for the parcel.

        **Note**: `callerId` and `userType` headers are not required on this endpoint
        based on the source — only `sheetId` and `parcelId` are consumed.

        **Authorization**: VIEWLAND required.
      parameters:
        - $ref: '#/components/parameters/organisationId'
        - $ref: '#/components/parameters/sheetId'
        - $ref: '#/components/parameters/parcelId'
      responses:
        '200':
          description: Land cover geometry feature collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapdFeatureCollectionLandCoverGeometry'
        '204':
          description: No land cover features found for the parcel
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /lms/parcels:
