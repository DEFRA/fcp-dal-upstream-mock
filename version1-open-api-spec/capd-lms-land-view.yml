        - $ref: '#/components/parameters/sheetId'
        - $ref: '#/components/parameters/parcelId'
        - name: includeGeometries
          in: query
          required: false
          description: Whether to include geometry data in each feature. Default false.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
      responses:
        '200':
          description: Land cover feature collection for the parcel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapdFeatureCollectionLandCovers'
        '404':
