          description: List of parcel centroids
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Centroid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /lms/organisation/{organisationId}/centroids/groups:
    get:
      tags:
        - organisation
      summary: Get group centroids for an organisation
      operationId: getGroupsCentroids
      description: |
