  /lms/organisation/{organisationId}/parcel/sheet-id/{sheetId}/parcel-id/{parcelId}/historic/{historicDate}/attributes-only:
    get:
      tags:
        - parcel
      summary: Get parcel attributes at a historic date
      operationId: getParcelAttributesOnlyHistoric
      description: |
        Returns parcel attributes at `historicDate`. Calls
        `parcelService.getParcelWithAttributesOnly(businessReference, sheetId, parcelId, historicDate)`.

        **Authorization**: VIEWLAND required.
      parameters:
        - $ref: '#/components/parameters/organisationId'
        - $ref: '#/components/parameters/sheetId'
        - $ref: '#/components/parameters/parcelId'
        - $ref: '#/components/parameters/historicDate'
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
      responses:
        '200':
          description: Parcel attributes at historic date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelNoGeometry'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /lms/organisation/{organisationId}/parcel/sheet-id/{sheetId}/parcel-id/{parcelId}/related:
    get:
      tags:
        - parcel
      summary: Check if a parcel exists for the organisation
      operationId: hasParcel
      description: |
        Returns a boolean indicating whether the specified parcel exists for the organisation.
        Calls `organisationService.hasParcel(businessReference, sheetId, parcelId)`.

        **Authorization**: VIEWLAND required.
      parameters:
        - $ref: '#/components/parameters/organisationId'
        - $ref: '#/components/parameters/sheetId'
        - $ref: '#/components/parameters/parcelId'
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
      responses:
        '200':
          description: Boolean — true if the parcel exists, false otherwise
          content:
