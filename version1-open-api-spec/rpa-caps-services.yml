                $ref: '#/components/schemas/ErrorResponse'
  /person/{personId}/validateEmailFlag:
    get:
      tags:
        - 'person'
      summary: 'Check if person email is validated.'
      description: "Returns whether the person's email address has been validated. HTTP 500 on exception."
      operationId: 'isValidated'
      parameters:
        - name: 'personId'
          in: 'path'
          description: 'Internal party identifier.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'true if email is validated, false otherwise.'
          content:
            application/json:
              schema:
                type: 'boolean'
        '500':
          description: 'Service exception.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /person/{personId}/{customerReference}/{obfuscationType}:
    delete:
      tags:
        - 'person'
      summary: 'Obfuscate (delete) person details.'
      description: |
        Obfuscates (irreversibly removes) personal data for the person identified by
        `personId` and `customerReference`. The `obfuscationType` parameter controls which
        data fields are obfuscated.

        **This is a destructive, irreversible operation.**

        HTTP 403 if caller not authorised. HTTP 404 if person not found. HTTP 500 on exception.
      operationId: 'obfuscatePersonDetails'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'personId'
          in: 'path'
          description: 'Internal party identifier.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'customerReference'
          in: 'path'
          description: 'Customer reference number.'
          required: true
          schema:
            type: 'string'
        - name: 'obfuscationType'
          in: 'path'
          description: 'Controls which personal data fields are obfuscated.'
          required: true
          schema:
            type: 'string'
        - name: 'userType'
          in: 'header'
          description: 'User type context.'
          required: false
          schema:
            type: 'string'
            enum:
              - 'internal'
              - 'external'
              - 'ida_no_match'
      responses:
        '200':
          description: 'Person data obfuscated.'
        '403':
          description: 'Caller not authorised.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Person not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Service exception.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /person/{personId}/{email}/confirm:
    get:
      tags:
        - 'person'
      summary: 'Confirm person email address.'
      description: 'Verifies and confirms the email address for the given person. HTTP 404 if person not found. HTTP 500 on exception.'
      operationId: 'confirmEmail'
      parameters:
        - name: 'personId'
          in: 'path'
          description: 'Internal party identifier.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'email'
          in: 'path'
          description: 'Email address to confirm.'
          required: true
          schema:
            type: 'string'
      responses:
        '200':
          description: 'Email confirmed.'
        '404':
          description: 'Person not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Service exception.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reference/business-types:
    get:
      tags:
        - 'reference'
      summary: 'Get business types.'
      description: |
        Returns all business type reference data, optionally filtered by classification
        flags. Used to populate `businessType.id` on organisation create/update requests.

        Multiple classification filters may be combined (OR logic).
      operationId: 'getBusinessTypesByClassification'
      parameters:
        - name: 'forAgent'
          in: 'query'
          description: 'If true, return only agent business types.'
          required: false
          schema:
            type: 'boolean'
        - name: 'forTrader'
          in: 'query'
          description: 'If true, return only trader business types.'
          required: false
          schema:
            type: 'boolean'
        - name: 'forVendor'
          in: 'query'
          description: 'If true, return only vendor business types.'
          required: false
          schema:
            type: 'boolean'
        - name: 'businessTypeId'
          in: 'query'
          description: 'If supplied, return only this specific business type ID.'
          required: false
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'List of business type reference data items.'
          content:
            application/json:
              schema:
                type: 'array'
                items:
                  $ref: '#/components/schemas/ReferenceDataItem'
  /reference/legalstatus:
    get:
      tags:
        - 'reference'
      summary: 'Get legal statuses.'
      description: 'Returns all legal status reference data. Used to populate `legalStatus.id` on organisation create/update requests.'
      operationId: 'getLegalStatuses'
      responses:
        '200':
          description: 'List of legal status reference data items.'
          content:
            application/json:
              schema:
                type: 'array'
                items:
                  $ref: '#/components/schemas/ReferenceDataItem'
  /reference/titles:
    get:
      tags:
        - 'reference'
      summary: 'Get titles.'
      description: 'Returns all title reference data (Mr, Mrs, Dr, etc.). Used to populate `title` on person requests.'
      operationId: 'getTitles'
      responses:
        '200':
          description: 'List of title reference data items.'
          content:
            application/json:
              schema:
                type: 'array'
                items:
                  $ref: '#/components/schemas/ReferenceDataItem'
  /validate-email-service/{partyId}/{code}/{digitalContactType}/validateEmailCode:
    get:
      tags:
        - 'validate-email-service'
      summary: 'Validate email verification code.'
      description: |
        Validates an email verification code for the given party and digital contact type.
        The `code` is a one-time token generated by `/person/{personId}/registration-codes`
        and stored in the `ValidateEmailCode` entity.

        **Validation logic**:
        1. Looks up a `ValidateEmailCode` record by `partyId` + `digitalContactType`
           (a numeric ID, not a string label).
        2. If a matching record is found, calls `setPartyDigitalContactVerified()` to mark
           the digital contact as confirmed.
        3. Returns `true` if the code was valid and the contact was confirmed; `false` if
           no matching code record exists for the party.

        HTTP 500 if `setPartyDigitalContactVerified()` throws `DaoException`.
      operationId: 'validateEmailCode'
      parameters:
        - name: 'partyId'
          in: 'path'
          description: 'Internal party identifier. Path regex: `[0-9]{0,20}`.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'code'
          in: 'path'
          description: 'Verification code (one-time token).'
          required: true
          schema:
            type: 'string'
        - name: 'digitalContactType'
          in: 'path'
          description: 'Digital contact type ID (numeric BigInteger, e.g. the ID for EMAIL_ADDRESS from MDMReferenceData).'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Validation result. `true` if the code matched and the contact was confirmed; `false` if no matching code record was found. Wrapped in CapdResponse with `_data` key.'
          content:
            application/json:
              schema:
                type: 'boolean'
        '500':
          description: 'Service exception.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /verify-email/{digitalContactPartyId}:
    post:
      tags:
        - 'verify-email'
      summary: 'Verify email for digital contact.'
      description: |
        Sends a verification email to the address associated with the given digital contact
        party. The request body is the email address to verify (plain string). Uses
        `VerifyEmailService.sendVerifyEmailAddress()` with a hardcoded sentinel callerId of
        `-1`. Path regex on `digitalContactPartyId`: `[0-9]{0,20}`.

        HTTP 500 on any exception during email dispatch.
      operationId: 'validateEmailCode_1'
      parameters:
        - name: 'digitalContactPartyId'
          in: 'path'
          description: 'Digital contact party identifier. Path regex: `[0-9]{0,20}`.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: 'string'
              description: 'Email address to verify.'
      responses:
        '200':
          description: 'Email dispatched. Returns the string `Success` wrapped in CapdResponse with `_data` key.'
          content:
            application/json:
              schema:
                type: 'string'
                example: 'Success'
        '500':
          description: 'Service exception.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    CallerIdAuth:
      type: 'apiKey'
      in: 'header'
      name: 'callerId'
      description: |
        All endpoints that require authentication use the `callerId` header.
        The value must be a valid caller identifier configured in capd-services.
        Some endpoints enforce specific callerId values (e.g., /person/internal restricts
        to the `internal-user-load` caller ID). Missing or invalid callerId → HTTP 403.
  schemas:
    UserContextResponse:
      type: 'object'
      description: |
        User context returned by GET /person/context. Source: UserContextResponse.java.
        `userFirstName` and `userLastName` are only populated when `type` is not `ida_no_match`;
        for `ida_no_match` callers the person lookup is skipped and those fields are absent.
      properties:
        callerId:
          type: 'integer'
          format: 'int64'
          description: "The caller's internal party identifier."
        type:
          type: 'string'
          enum:
            - 'internal'
            - 'external'
            - 'ida_no_match'
          description: 'User type derived from the `userType` request header.'
        userFirstName:
          type: 'string'
          description: 'First name of the person. Absent when type is `ida_no_match`.'
        userLastName:
          type: 'string'
          description: 'Last name of the person. Absent when type is `ida_no_match`.'
    PersonNameAndEmailResponse:
      type: 'object'
      description: 'Person name and email summary. Source: PersonNameAndEmailResponse.java.'
      properties:
        id:
          type: 'integer'
          format: 'int64'
          description: 'Internal party identifier.'
        firstName:
          type: 'string'
          description: 'Person first name.'
        lastName:
          type: 'string'
          description: 'Person last name.'
        email:
          type: 'string'
          description: 'Email address.'
    PersonEmailAndCustomerReferenceResponse:
      type: 'object'
      description: 'Person email and CRN pair. Source: PersonEmailAndCustomerReferenceResponse.java.'
      properties:
        email:
          type: 'string'
          description: 'Email address.'
        customerReferenceNumber:
          type: 'string'
          description: 'Customer Reference Number (CRN).'
    PartyAddressResponse:
      type: 'object'
      description: |
        Party address in BS7666 format. Source: PartyAddressResponse.java.
        Only returned when the stored primary address passes server-side BS7666 validation
        (at least one of flatName, buildingName, street, city, or county must be present).
      properties:
        address1:
          type: 'string'
          description: 'Generic address line 1.'
        address2:
          type: 'string'
          description: 'Generic address line 2.'
        address3:
          type: 'string'
          description: 'Generic address line 3.'
        address4:
          type: 'string'
          description: 'Generic address line 4.'
        address5:
          type: 'string'
          description: 'Generic address line 5.'
        pafOrganisationName:
          type: 'string'
          description: 'PAF (Postcode Address File) organisation name.'
        flatName:
          type: 'string'
          description: 'Flat or sub-unit name. Presence used in BS7666 format validation.'
        buildingNumberRange:
          type: 'string'
          description: 'Building number or range (e.g. `12-14`).'
        buildingName:
          type: 'string'
          description: 'Building name. Presence used in BS7666 format validation.'
        street:
          type: 'string'
          description: 'Street name. Presence used in BS7666 format validation.'
        city:
          type: 'string'
          description: 'City or town. Presence used in BS7666 format validation.'
        county:
          type: 'string'
          description: 'County. Presence used in BS7666 format validation.'
        postalCode:
          type: 'string'
          description: 'Postcode.'
        country:
          type: 'string'
          description: 'Country.'
        uprn:
          type: 'string'
          description: 'Unique Property Reference Number.'
        dependentLocality:
          type: 'string'
          description: 'Dependent locality (e.g. village within a town).'
        doubleDependentLocality:
          type: 'string'
          description: 'Double-dependent locality.'
        addressTypeId:
          type: 'integer'
          format: 'int64'
          description: 'Reference data ID for the address type.'
    ErrorResponse:
      type: 'object'
      description: 'Standard error response body returned on 4xx/5xx responses.'
      properties:
        message:
          type: 'string'
          description: 'Human-readable error message.'
        code:
          type: 'string'
          description: 'Machine-readable error code.'
        timestamp:
          type: 'string'
          format: 'date-time'
          description: 'Time the error occurred.'
    CapdMdmResponse:
      type: 'object'
      description: |
        Response wrapper for all MDM data-load endpoints. On logical failure, the service
        returns HTTP 200 with `_data.result = ERROR` rather than 4xx. Only infrastructure
        failures return HTTP 5xx.
      properties:
        _data:
          type: 'object'
          properties:
            result:
              type: 'string'
              description: 'OK on success, ERROR on logical failure.'
              enum:
                - 'OK'
                - 'ERROR'
            message:
              type: 'string'
              description: 'Human-readable result message.'
            id:
              type: 'integer'
              format: 'int64'
              description: 'Internal ID of the created/updated record (when applicable).'
    MDMOrganisation:
      type: 'object'
      description: 'MDM organisation record for create/update operations.'
      properties:
        mdmPartyId:
          type: 'string'
          description: 'MDM party ID. Required.'
        name:
          type: 'string'
          maxLength: 160
          description: 'Organisation name. Max 160 chars (Organisation.java @Size(max=160)).'
        taxRegistrationNumber:
          type: 'string'
          minLength: 9
          maxLength: 9
          pattern: '^[0-9]{9}$'
          description: 'Tax registration number. Exactly 9 numeric digits.'
        businessReference:
          type: 'string'
          description: 'Firm Reference Number (FRN). Must be non-null (NOT NULL DB constraint).'
      required:
        - 'mdmPartyId'
    MDMPerson:
      type: 'object'
      description: 'MDM person record for create/update operations.'
      properties:
        mdmPartyId:
          type: 'string'
          description: 'MDM party ID. Required.'
        firstName:
          type: 'string'
          maxLength: 100
          description: 'First name. Max 100 chars (PersonImpl.java @Size(max=100)).'
        lastName:
          type: 'string'
          maxLength: 100
          description: 'Last name. Max 100 chars.'
        middleName:
          type: 'string'
          maxLength: 100
          description: 'Middle name. Max 100 chars.'
        title:
          type: 'string'
          maxLength: 20
          description: 'Title. Max 20 chars.'
        nationalInsuranceNumber:
          type: 'string'
          maxLength: 9
          description: 'National Insurance Number. Max 9 chars, uppercase.'
      required:
        - 'mdmPartyId'
    MDMPartyDigitalContact:
      type: 'object'
      description: 'MDM digital (email) contact record.'
      properties:
        mdmPartyId:
          type: 'string'
          description: 'MDM party ID. Required.'
        mdmPartyContactId:
          type: 'string'
          description: 'MDM contact ID. Required.'
        digitalContactTypeId:
          type: 'integer'
          format: 'int64'
          description: 'Digital contact type identifier. Required.'
        digitalAddress:
          type: 'string'
          maxLength: 254
          description: 'Email address. Max 254 chars.'
      required:
        - 'mdmPartyId'
        - 'mdmPartyContactId'
        - 'digitalContactTypeId'
    MDMPartyAddress:
      type: 'object'
      description: 'MDM party address record. Field limits from PartyAddress.java.'
      properties:
        mdmPartyId:
          type: 'string'
          description: 'MDM party ID. Required.'
        mdmPartyAddressId:
          type: 'string'
          description: 'MDM address ID. Required.'
        address1:
          type: 'string'
          maxLength: 240
        address2:
          type: 'string'
          maxLength: 240
        address3:
          type: 'string'
          maxLength: 240
        address4:
          type: 'string'
          maxLength: 240
        address5:
          type: 'string'
          maxLength: 240
        flatName:
          type: 'string'
          maxLength: 240
        buildingName:
          type: 'string'
          maxLength: 240
        buildingNumberRange:
          type: 'string'
          maxLength: 240
        street:
          type: 'string'
          maxLength: 240
        dependentLocality:
          type: 'string'
          maxLength: 240
        doubleDependentLocality:
          type: 'string'
          maxLength: 240
        city:
          type: 'string'
          maxLength: 60
        county:
          type: 'string'
          maxLength: 60
        country:
          type: 'string'
          maxLength: 100
        postalCode:
          type: 'string'
          maxLength: 8
          description: 'Postal code. Validated by custom @PostCode validator (format check, not just length).'
        uprn:
          type: 'string'
          maxLength: 12
          description: 'Unique Property Reference Number. Max 12 chars.'
      required:
        - 'mdmPartyId'
        - 'mdmPartyAddressId'
    MDMPartyPhoneContact:
      type: 'object'
      description: 'MDM phone contact record.'
      properties:
        mdmPartyId:
          type: 'string'
          description: 'MDM party ID. Required.'
        mdmPartyContactId:
          type: 'string'
          description: 'MDM contact ID. Required.'
        phoneContactTypeId:
          type: 'integer'
          format: 'int64'
          description: 'Phone contact type identifier. Required.'
        phoneNumber:
          type: 'string'
          maxLength: 50
          description: 'Phone number. Max 50 chars.'
      required:
        - 'mdmPartyId'
        - 'mdmPartyContactId'
        - 'phoneContactTypeId'
    MDMLegacyIdentifier:
      type: 'object'
      description: 'MDM legacy identifier record.'
      properties:
        mdmPartyId:
          type: 'string'
          description: 'MDM party ID. Required.'
        mdmIdentifierId:
          type: 'string'
          description: 'MDM identifier ID. Required.'
        identifierValue:
          type: 'string'
          maxLength: 75
          description: 'Identifier value. Max 75 chars. Required.'
        identifierTypeId:
          type: 'integer'
          format: 'int64'
          description: 'Identifier type.'
      required:
        - 'mdmPartyId'
        - 'mdmIdentifierId'
        - 'identifierValue'
    MDMEmpowerment:
      type: 'object'
      description: 'MDM empowerment record. All four fields are required.'
      properties:
        mdmPersonPartyId:
          type: 'string'
          description: 'MDM party ID of the person being empowered. Required.'
        mdmOrgPartyId:
          type: 'string'
          description: 'MDM party ID of the organisation. Required.'
        role:
          type: 'string'
          description: 'Role within the empowerment. Required.'
        privilege:
          type: 'string'
          description: 'Privilege level. Required.'
      required:
        - 'mdmPersonPartyId'
        - 'mdmOrgPartyId'
        - 'role'
        - 'privilege'
    MDMEmpowermentDelete:
      type: 'object'
      description: 'MDM empowerment delete request. All four fields are required to identify the empowerment.'
      properties:
        mdmPersonPartyId:
          type: 'string'
          description: 'MDM party ID of the person. Required.'
        mdmOrgPartyId:
          type: 'string'
          description: 'MDM party ID of the organisation. Required.'
        role:
          type: 'string'
          description: 'Role of the empowerment to delete. Required.'
        privilege:
          type: 'string'
          description: 'Privilege of the empowerment to delete. Required.'
      required:
        - 'mdmPersonPartyId'
        - 'mdmOrgPartyId'
        - 'role'
        - 'privilege'
    Notification:
      type: 'object'
      description: 'Notification payload. The `internalMessageType` field discriminates the notification subtype.'
      properties:
        internalMessageType:
          type: 'string'
          description: 'Discriminator for notification type.'
          enum:
            - 'ChangeOfPrivileges'
            - 'NewPrivileges'
            - 'RemovedPrivileges'
        partyId:
          type: 'integer'
          format: 'int64'
          description: 'Party identifier the notification relates to.'
        message:
          type: 'string'
          description: 'Notification message text.'
        timestamp:
          type: 'string'
          format: 'date-time'
          description: 'Time the notification was generated.'
    PartyAddressRequest:
      type: 'object'
      description: |
        Address request payload. Supports two validation modes:
        - **UPRN mode**: provide `uprn` only (max 12 chars). No other fields required.
        - **Manual mode**: `address1`, `city`, `postalCode`, and `country` are all required.
          Field size limits sourced from PartyAddress.java.
      properties:
        uprn:
          type: 'string'
          maxLength: 12
          description: 'Unique Property Reference Number. When supplied, manual fields are not required.'
        address1:
          type: 'string'
          maxLength: 240
          description: 'Required in manual mode.'
        address2:
          type: 'string'
          maxLength: 240
        address3:
          type: 'string'
          maxLength: 240
        address4:
          type: 'string'
          maxLength: 240
        address5:
          type: 'string'
          maxLength: 240
        flatName:
          type: 'string'
          maxLength: 240
        buildingName:
          type: 'string'
          maxLength: 240
        buildingNumberRange:
          type: 'string'
          maxLength: 240
        street:
          type: 'string'
          maxLength: 240
        dependentLocality:
          type: 'string'
          maxLength: 240
        doubleDependentLocality:
          type: 'string'
          maxLength: 240
        city:
          type: 'string'
          maxLength: 60
          description: 'Required in manual mode.'
        county:
          type: 'string'
          maxLength: 60
        country:
          type: 'string'
          maxLength: 100
          description: 'Required in manual mode.'
        postalCode:
          type: 'string'
          maxLength: 8
          description: 'Required in manual mode. Validated by custom @PostCode validator (format check).'
    PersonRequest:
      type: 'object'
      description: 'Person create/update request. Field constraints from PersonImpl.java.'
      properties:
        id:
          type: 'integer'
          format: 'int64'
          description: 'Internal party ID. Must be null on create requests.'
        firstName:
          type: 'string'
          maxLength: 100
          description: 'Max 100 chars (@Size(max=100)).'
        lastName:
          type: 'string'
          maxLength: 100
          description: 'Max 100 chars.'
        middleName:
          type: 'string'
          maxLength: 100
          description: 'Max 100 chars.'
        title:
          type: 'string'
          maxLength: 20
          description: 'Max 20 chars.'
        nationalInsuranceNumber:
          type: 'string'
          maxLength: 9
          description: 'National Insurance Number. Max 9 chars, uppercase. Required when person is a legally responsible person.'
        dateOfBirth:
          type: 'string'
          format: 'date'
          description: 'Date of birth.'
        landline:
          type: 'string'
          maxLength: 50
          description: 'Landline phone number. Max 50 chars.'
        mobile:
          type: 'string'
          maxLength: 50
          description: 'Mobile phone number. Max 50 chars.'
        email:
          type: 'string'
          maxLength: 254
          description: 'Email address (digitalAddress). Max 254 chars.'
        address:
          $ref: '#/components/schemas/PartyAddressRequest'
        percentageOfBusinessOwned:
          type: 'number'
          description: 'Required when person is a legally responsible person.'
        percentageOfVotingRights:
          type: 'number'
          description: 'Required when person is a legally responsible person.'
    PersonWithAddressResponse:
      type: 'object'
      description: 'Full person response with address and contact details.'
      properties:
        id:
          type: 'integer'
          format: 'int64'
        firstName:
          type: 'string'
        lastName:
          type: 'string'
        middleName:
          type: 'string'
        title:
          type: 'string'
        nationalInsuranceNumber:
          type: 'string'
        dateOfBirth:
          type: 'string'
          format: 'date'
        landline:
          type: 'string'
        mobile:
          type: 'string'
        email:
          type: 'string'
        address:
          $ref: '#/components/schemas/PartyAddressRequest'
        status:
          type: 'string'
          enum:
            - 'active'
            - 'deactivated'
            - 'locked'
    PersonBaseResponse:
      type: 'object'
      description: 'Brief person summary.'
      properties:
        id:
          type: 'integer'
          format: 'int64'
        firstName:
          type: 'string'
        lastName:
          type: 'string'
        status:
          type: 'string'
    PersonalDetailsRequest:
      type: 'object'
      description: 'Personal details update request.'
      properties:
        firstName:
          type: 'string'
          maxLength: 100
        lastName:
          type: 'string'
          maxLength: 100
        middleName:
          type: 'string'
          maxLength: 100
        title:
          type: 'string'
          maxLength: 20
        dateOfBirth:
          type: 'string'
          format: 'date'
    ContactDetailsRequest:
      type: 'object'
      description: 'Contact details update request.'
      properties:
        email:
          type: 'string'
          maxLength: 254
        landline:
          type: 'string'
          maxLength: 50
        mobile:
          type: 'string'
          maxLength: 50
    OrganisationWithAllRequest:
      type: 'object'
      description: |
        Full organisation create/update request. Validated by OrganisationWithAllValidator.
        The `id` field must be null on create requests.

        **Required fields on create:**
        - name, businessType.id, businessReference, legalStatus.id
        - at least one of: landline, mobile
        - address (UPRN mode or manual mode — see PartyAddressRequest)
        - taxRegistrationNumber (required when businessType ≠ AGENCY)

        **Persons array validation** (when supplied):
        - Each person: nationalInsuranceNumber, percentageOfBusinessOwned, percentageOfVotingRights
        - NINO must be unique within the array
      properties:
        id:
          type: 'integer'
          format: 'int64'
          description: 'Must be null on create requests. Non-null → HTTP 404.'
        name:
          type: 'string'
          maxLength: 160
          description: 'Organisation name. Max 160 chars. Required.'
        businessType:
          $ref: '#/components/schemas/ReferenceDataItem'
        legalStatus:
          $ref: '#/components/schemas/ReferenceDataItem'
        businessReference:
          type: 'string'
          description: 'Firm Reference Number (FRN). NOT NULL constraint.'
        taxRegistrationNumber:
          type: 'string'
          minLength: 9
          maxLength: 9
          pattern: '^[0-9]{9}$'
          description: 'Tax registration number. Exactly 9 numeric digits. Required unless businessType = AGENCY.'
        landline:
          type: 'string'
          maxLength: 50
          description: 'Landline. At least one of landline/mobile required.'
        mobile:
          type: 'string'
          maxLength: 50
          description: 'Mobile. At least one of landline/mobile required.'
        email:
          type: 'string'
          maxLength: 254
        address:
          $ref: '#/components/schemas/PartyAddressRequest'
        correspondenceAddress:
          $ref: '#/components/schemas/PartyAddressRequest'
        correspondenceEmail:
          type: 'string'
          maxLength: 254
        correspondenceLandline:
          type: 'string'
          maxLength: 50
        correspondenceMobile:
          type: 'string'
          maxLength: 50
        isFinancialToBusinessAddr:
          type: 'boolean'
        isCorrespondenceAsBusinessAddr:
          type: 'boolean'
        persons:
          type: 'array'
          description: 'Legally responsible persons. NINO must be unique within array.'
          items:
            $ref: '#/components/schemas/PersonRequest'
    OrganisationWithAllResponse:
      type: 'object'
      description: 'Full organisation response including addresses, contacts, and legally responsible persons.'
      properties:
        id:
          type: 'integer'
          format: 'int64'
        name:
          type: 'string'
        businessReference:
          type: 'string'
        taxRegistrationNumber:
          type: 'string'
        businessType:
