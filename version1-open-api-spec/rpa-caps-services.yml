        Returns cases matching the provided filter criteria. **At least one filter parameter
        must be supplied** (`queueId`, `caseStatusId`, `caseOwnerId`, or `partyId`); requests
        with no filters are rejected. HTTP 500 on SitiAgri retrieval failure.
      operationId: 'getCases'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'queueId'
          in: 'query'
          description: 'Filter by queue identifier. At least one filter is required.'
          required: false
          schema:
            type: 'string'
        - name: 'caseStatusId'
          in: 'query'
          description: 'Filter by case status identifier.'
          required: false
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'caseOwnerId'
          in: 'query'
          description: 'Filter by case owner person identifier.'
          required: false
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'partyId'
          in: 'query'
          description: 'Filter by party identifier.'
          required: false
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'List of case summaries matching the filter.'
          content:
            application/json:
              schema:
                type: 'array'
                items:
                  $ref: '#/components/schemas/CaseSummaryResponse'
        '500':
          description: 'Cannot fetch cases.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /case-management/case/{caseId}/notes:
    get:
