  /organisation/create/{personId}:
    post:
      tags:
        - 'organisation'
      summary: 'Create organisation for person.'
      description: |
        Creates a new organisation in CAPD, assigns an ID and reference number, then
        registers it in SitiAgri.

        **Critical constraint**: The `id` field in the request body **must be null**.
        If a non-null ID is supplied, HTTP 404 is returned with message "Malformed data - id should be null".

        **Required fields:**
        - `name` — max 160 characters
        - `businessType.id` — business type identifier
        - `businessReference` — Firm Reference Number (FRN)
        - `legalStatus.id` — legal status identifier
        - At least one of `landline` or `mobile`

        **Address validation** (choose one mode):
        - *UPRN mode*: supply `uprn` only (max 12 chars); no other address fields required
        - *Manual mode*: `address1`, `city`, `postalCode`, `country` are all required

        **Tax registration number**: Required when `businessType.id` does not correspond to
        AGENCY. This is enforced at service layer, not DTO level. Max 16 characters.

        **Persons array validation** (when `persons` array is provided): Each person entry
        must include `nationalInsuranceNumber` (max 9 chars, uppercase), `percentageOfBusinessOwned`,
        and `percentageOfVotingRights`.

        The validator `OrganisationWithAllValidator` is applied to the full request.
        HTTP 400 on validation failure, HTTP 500 on service creation failure.
      operationId: 'createOrganisationForPerson'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'personId'
          in: 'path'
          description: 'Internal party identifier of the person creating the organisation.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'userType'
          in: 'header'
          description: 'User type context.'
          required: false
          schema:
            type: 'string'
            enum:
              - 'internal'
              - 'external'
              - 'ida_no_match'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationWithAllRequest'
      responses:
        '200':
          description: 'Organisation created. Returns full organisation detail.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationWithAllResponse'
        '400':
          description: 'Validation failure: payload did not pass OrganisationWithAllValidator.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'id field in request body was not null (malformed data).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Service creation failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organisation/confirmation/details:
    get:
      tags:
        - 'organisation'
      summary: 'Find unconfirmed organisation for person.'
      description: |
        Finds whether the person has exactly one unconfirmed organisation assigned.
        Used during the organisation confirmation flow.
      operationId: 'findOrganisationConfirmationDetails'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'personId'
          in: 'query'
          description: 'Internal party identifier of the person.'
          required: false
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Organisation confirmation details.'
          content:
            application/json:
              schema:
                type: 'object'
  /organisation/{organisationId}:
    get:
      tags:
        - 'organisation'
      summary: 'Get full organisation detail.'
      description: |
        Returns full organisation details including addresses, contacts, persons, and
        business details.

        **`userType` header behaviour**: Although marked optional, the service returns
        HTTP 400 with "userType must not be empty" if this header is absent. Treat it
        as effectively required.

        Locked organisations: external callers (`userType=external`) receive a restricted
        view that omits sensitive fields.
      operationId: 'getByPartyId'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'Internal party identifier of the organisation.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'userType'
          in: 'header'
          description: 'User type context. Effectively required — HTTP 400 if absent.'
          required: false
          schema:
            type: 'string'
            enum:
              - 'internal'
              - 'external'
              - 'ida_no_match'
      responses:
        '200':
          description: 'Full organisation detail.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationWithAllResponse'
        '400':
          description: 'userType header is missing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Organisation not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - 'organisation'
      summary: 'Full update of organisation.'
      description: |
        Replaces the full organisation record. This is a **full replacement**, not a PATCH.
        All validated fields must be present and valid; omitting a required field is treated
        as a validation failure.

        Applies the same validation rules as POST /organisation/create/{personId}:
        - `name` max 160 characters
        - Address mode: UPRN or Manual (address1 + city + postalCode + country)
        - At least one of `landline` or `mobile`
        - `taxRegistrationNumber` required unless businessType = AGENCY (exactly 9 numeric digits)
        - `persons` array: each entry requires `nationalInsuranceNumber`, `percentageOfBusinessOwned`,
          `percentageOfVotingRights`

        HTTP 404 if organisation not found. HTTP 500 on update failure.
      operationId: 'updateOrganisation_1'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'Internal party identifier of the organisation to update.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'userType'
          in: 'header'
          description: 'User type context.'
          required: false
          schema:
            type: 'string'
            enum:
              - 'internal'
              - 'external'
              - 'ida_no_match'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationWithAllRequest'
      responses:
        '200':
          description: 'Updated organisation detail.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationWithAllResponse'
        '404':
          description: 'Organisation not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Update unsuccessful.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - 'organisation'
      summary: 'Delete organisation.'
      description: 'Deletes the organisation record. HTTP 404 if not found, HTTP 500 on DAO exception.'
      operationId: 'deleteOrganisation_1'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'Internal party identifier of the organisation to delete.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Organisation deleted.'
        '404':
          description: 'Organisation not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'DAO exception.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organisation/{organisationId}/deactivate:
    post:
      tags:
        - 'organisation'
      summary: 'Deactivate organisation.'
      description: |
        Deactivates the organisation. This is a state-machine transition:
        - The organisation must currently be in an active state
        - `reason` and `note` in the request body are both **required** and must be non-empty
          → HTTP 400 if either is missing or blank
        - `partyNoteType` must be `DeactivateOrganisation` (enforced at service layer)

        HTTP 404 if organisation not found.
        HTTP 500 if `organisationId` is null or DAO error occurs.
      operationId: 'deactivateOrganisation'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'Internal party identifier.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyNoteRequest'
      responses:
        '200':
          description: 'Organisation deactivated.'
        '400':
          description: 'reason or note is missing or blank.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Organisation not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'organisationId null or DAO error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organisation/{organisationId}/lock:
    post:
      tags:
        - 'organisation'
      summary: 'Lock organisation.'
      description: |
        Locks the organisation. **State machine constraint**: the organisation must not
        already be locked; attempting to lock an already-locked organisation returns HTTP 403.
        `reason` and `note` are both required → HTTP 400 if missing.
        `partyNoteType` must be `LockOrganisation`.
        HTTP 404 if not found. HTTP 500 if organisationId null.
      operationId: 'lockOrganisation'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'Internal party identifier.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyNoteRequest'
      responses:
        '200':
          description: 'Organisation locked.'
        '400':
          description: 'reason or note is missing or blank.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Organisation is already locked.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Organisation not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'organisationId null or DAO error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organisation/{organisationId}/unlock:
    post:
      tags:
        - 'organisation'
      summary: 'Unlock organisation.'
      description: |
        Unlocks a locked organisation. **State machine constraint**: the organisation must
        currently be locked; attempting to unlock a non-locked organisation returns HTTP 403.
        `reason` and `note` are both required → HTTP 400 if missing.
        `partyNoteType` must be `UnlockOrganisation`.
      operationId: 'unlockOrganisation'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'Internal party identifier.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyNoteRequest'
      responses:
        '200':
          description: 'Organisation unlocked.'
        '400':
          description: 'reason or note is missing or blank.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Organisation is not locked; cannot unlock.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Organisation not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'organisationId null or DAO error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organisation/{organisationId}/reactivate:
    post:
      tags:
        - 'organisation'
      summary: 'Reactivate organisation.'
      description: |
        Reactivates a deactivated organisation. **State machine constraint**: the
        organisation must currently be deactivated; attempting to reactivate an
        active organisation returns HTTP 403.
        `reason` and `note` are both required → HTTP 400 if missing.
        `partyNoteType` must be `ReactivateOrganisation`.
      operationId: 'reactivateOrganisation'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'Internal party identifier.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyNoteRequest'
      responses:
        '200':
          description: 'Organisation reactivated.'
        '400':
