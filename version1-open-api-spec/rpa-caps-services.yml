      summary: 'Get EOI by SBI.'
      description: |
        Returns the Expression of Interest record for the given Single Business Identifier.
        **Important**: If no EOI exists for the SBI, HTTP 200 is returned with an empty
        response body — not HTTP 404. HTTP 400 if SBI is missing or null.
      operationId: 'getEOIbySbi'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'sbi'
          in: 'path'
          description: 'Single Business Identifier.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'EOI record if found, empty body if not found (no 404 is raised).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpressionOfInterestResponse'
        '400':
          description: 'SBI is missing or null.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /eoi:
    post:
      tags:
