      summary: 'Search internal users.'
      description: |
        Searches for internal users by name or email. Intended to allow internal users to
        find other internal users for case assignment. The `search` parameter is matched
        against name and email fields.
      operationId: 'search'
      parameters:
        - name: 'search'
          in: 'query'
          description: 'Search term matched against internal user names and email addresses.'
          required: false
          schema:
            type: 'string'
      responses:
        '200':
          description: 'List of matching internal users.'
          content:
