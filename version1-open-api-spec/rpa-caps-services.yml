    AlertImageRequest:
      type: 'object'
      description: |
        Alert create request with image. Image must be base64-encoded with content-type prefix.
        Accepted prefixes: `data:image/png;base64,`, `data:image/jpg;base64,`, `data:image/jpeg;base64,`.
        Maximum decoded image size: approximately 20 KB.
      properties:
        altText:
          type: 'string'
          minLength: 10
          description: 'Alert text. Minimum 10 characters.'
        title:
          type: 'string'
        image:
          type: 'string'
          description: |
            Base64-encoded image with data URI prefix.
            Valid formats: data:image/png;base64,... or data:image/jpg;base64,... or data:image/jpeg;base64,...
            Max decoded size ~20 KB.
        startDate:
          type: 'string'
          format: 'date-time'
        endDate:
          type: 'string'
          format: 'date-time'
        active:
          type: 'boolean'
      required:
        - 'altText'
        - 'image'
    AlertResponse:
      type: 'object'
      description: 'Alert response.'
      properties:
        id:
