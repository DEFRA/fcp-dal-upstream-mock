            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /gdpr/alerts/{daysToRetain}:
    delete:
      tags:
        - 'gdpr'
      summary: 'Remove old alerts for GDPR compliance.'
      description: |
        Deletes alert records older than `daysToRetain` days. Used for GDPR data retention
        enforcement. Path parameter must be a positive integer (pattern `[0-9]+`).
        Returns HTTP 204 if no rows were removed, HTTP 200 if rows were removed.
      operationId: 'removeOldAlerts'
      parameters:
        - name: 'daysToRetain'
          in: 'path'
          description: 'Number of days to retain alerts. Alerts older than this value are deleted. Must be a positive integer.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
            minimum: 0
      responses:
        '200':
          description: 'Rows removed.'
          content:
            application/json:
              schema:
                type: 'object'
        '204':
          description: 'No rows removed (all alerts are within the retention period).'
          content:
            application/json:
              schema:
                type: 'object'
        '500':
          description: 'Failed to remove older alerts.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ida-alternative/send-code:
    post:
      tags:
        - 'ida-alternative'
      summary: 'Send identity verification code.'
      description: |
        Sends a verification code to the customer identified by their CRN and email address.
        Used as an alternative to IDA (Identity Assurance) for customers who cannot use the
        standard flow.

        **Validation rules:**
        - `email` and `crn` must match an existing customer record → HTTP 401 if mismatch
        - A maximum of 3 codes may be active simultaneously for a given CRN. If 3 codes
          already exist, HTTP 403 is returned (this is a rate limit, not a permission failure)
        - Third-party service errors → HTTP 500

        Both `email` and `crn` are query parameters and both should be provided.
      operationId: 'sendCode'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'email'
          in: 'query'
          description: 'Customer email address. Must match the CRN on file.'
          required: false
          schema:
            type: 'string'
        - name: 'crn'
          in: 'query'
          description: 'Customer Reference Number. Must match the email on file.'
          required: false
          schema:
            type: 'string'
      responses:
        '200':
          description: 'Verification code sent to customer.'
        '401':
          description: 'CRN and email do not match.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Maximum of 3 verification codes already active for this CRN (rate limit).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Third-party service error or unable to match CRN and email.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal-user:
