            - 'active'
            - 'deactivated'
            - 'locked'
        confirmed:
          type: 'boolean'
        persons:
          type: 'array'
          items:
            $ref: '#/components/schemas/PersonWithAddressResponse'
    OrganisationBaseResponse:
      type: 'object'
