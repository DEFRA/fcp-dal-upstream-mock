      summary: 'Submit feedback.'
      description: |
        Saves user feedback. The feedback text is sent as a plain JSON string in the request body.
        HTTP 400 if the email delivery fails (feedback is sent via email).
        HTTP 500 on DAO exception.
      operationId: 'saveFeedback'
      security:
        - CallerIdAuth: []
      requestBody:
        required: false
        content:
          application/json:
