              schema:
                type: 'array'
                items:
                  $ref: '#/components/schemas/InternalUserSearchResponse'
  /internal-user/{email}/locked:
    put:
      tags:
        - 'internal-user'
      summary: 'Change internal user locked status.'
      description: |
        Locks or unlocks an internal user identified by their email address.

        **State machine rules:**
        - Cannot lock a user who is already locked → HTTP 403
        - The `locked` field in the request body controls the target state

        **Field constraints (InternalPerson.java):**
        - Internal user firstName: max 50 characters
        - Internal user lastName: max 50 characters
        (Note: these differ from external person names which are max 100 characters)

        HTTP 404 if multiple users share the email (data integrity issue) or user not found.
        HTTP 500 on internal server error.
      operationId: 'changeLockedStatus'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'email'
          in: 'path'
          description: 'Email address of the internal user to lock/unlock.'
          required: true
          schema:
            type: 'string'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeInternalPersonLockedStatusRequest'
      responses:
        '200':
          description: 'Lock status updated.'
        '403':
          description: 'User is already locked (cannot lock an already-locked user).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'User not found, or multiple users share this email address.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /internal-user/locked:
    get:
      tags:
        - 'internal-user'
