  /organisation/{organisationId}/business-details:
    put:
      tags:
        - 'organisation'
      summary: 'Update business contact details.'
      description: |
        Updates the business contact details section of an organisation: name, addresses,
        email contacts, phone contacts, tax registration number, and business type.

        **All-or-nothing atomic validation**: Every field in the payload — including fields
        whose values have not changed — is independently validated before any database write
        occurs. If a single field fails validation the entire transaction is rejected with
        HTTP 400, even if the failing field already held an invalid value before this request.
        Callers must ensure the complete payload is valid, not just the changed fields.

        **Field constraints (sourced from OrganisationDetailsRequest + domain model):**
        - `name`: max 160 characters (Organisation.java `@Size(max=160)`)
        - `address` / `correspondenceAddress`: PartyAddressRequest — see address validation rules
        - Address validation modes:
          - *UPRN mode*: `uprn` only required (max 12 chars, stored as string)
          - *Manual mode*: `address1` + `city` + `postalCode` + `country` all required;
            address1–5 max 240 chars, city/county max 60, country max 100;
            postalCode subject to custom `@PostCode` validator (format-checked, not just length)
        - `email` / `correspondenceEmail`: max 254 characters each
        - `landline` / `mobile` / `correspondenceLandline` / `correspondenceMobile`: max 50 chars each
        - `taxRegistrationNumber`: exactly 9 numeric digits (pattern `^[0-9]{9}$`). **Conditionally required**: must be
          provided when `businessType.id` does not correspond to AGENCY. Enforced at service
          layer (not DTO annotation). Omitting it for non-AGENCY types → HTTP 400.
        - `isFinancialToBusinessAddr`, `isCorrespondenceAsBusinessAddr`: boolean flags

        Returns HTTP 204 (no response body) on success.
        HTTP 400 on any validation failure.
        HTTP 404 if organisation does not exist.
        HTTP 500 on internal server error.

        Source: x-validation-source: repos/capd-services/capd-ws/src/main/java/uk/gov/defra/capd/data/ws/resources/OrganisationResource.java
      operationId: 'updateBusinessDetails'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'Internal party identifier of the organisation to update.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'userType'
          in: 'header'
          description: 'User type context.'
          required: false
          schema:
            type: 'string'
            enum:
              - 'internal'
              - 'external'
              - 'ida_no_match'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationDetailsRequest'
      responses:
        '204':
          description: 'Successfully updated. No response body.'
        '400':
          description: |
            Validation failure. All fields (including unchanged ones) must individually pass
            validation. Common causes: name exceeds 160 chars, postalCode fails format check,
            taxRegistrationNumber missing for non-AGENCY type, email exceeds 254 chars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Organisation not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
