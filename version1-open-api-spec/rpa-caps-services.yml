          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Case detail.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '404':
          description: 'Case not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /case-management/case:
