      description: |
        Returns the assisted assurance state for the external person identified by their
        customer reference. State is determined by querying the external user auth service
        (not the local CAPD database):
        1. If a registration code exists for the customer → `RegistrationCodeCreated`
        2. Else if a user account exists for the customer → `UserCreated`
        3. Otherwise → `NoProgress`

        HTTP 500 on `ExternalUserAuthClientException`.
      operationId: 'getAssistedAssuranceState'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'customerReference'
          in: 'path'
          description: 'Customer reference number.'
          required: true
          schema:
            type: 'string'
      responses:
        '200':
          description: 'Assisted assurance registration state. Wrapped in CapdResponse with `_data` key.'
          content:
            application/json:
              schema:
                type: 'string'
                enum:
                  - 'NoProgress'
                  - 'RegistrationCodeCreated'
                  - 'UserCreated'
                description: 'Enum value from AssistedAssuranceRegistrationState. `RegistrationCodeCreated` takes precedence over `UserCreated`.'
        '500':
          description: 'Service exception.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
