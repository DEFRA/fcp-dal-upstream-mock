      parameters:
        - name: 'caseId'
          in: 'path'
          description: 'Case identifier (up to 20 digits).'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Case detail including notes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '404':
          description: 'Case not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Internal server error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - 'case-management'
      summary: 'Create case note.'
      description: |
        Adds a note to an existing case.

        **Required fields** (all validated; any missing field → HTTP 404/500):
        - `addedById` — person ID of the note author
        - `caseId` — must match the path parameter
        - `dateAdded` — timestamp of the note
        - `note` — the note text; minimum 1 character, maximum 2000 characters

        HTTP 404 if the case does not exist.
        HTTP 500 on DAO exception.
      operationId: 'createCaseNote'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'caseId'
          in: 'path'
          description: 'Case identifier (up to 20 digits).'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultCaseNote'
      responses:
        '200':
          description: 'Case note created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '404':
          description: 'Case not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'DAO exception.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digital-party:
    post:
      tags:
