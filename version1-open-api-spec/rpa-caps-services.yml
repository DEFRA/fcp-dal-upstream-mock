      summary: 'Generate registration code for customer.'
      description: |
        Generates a registration code for the given person (customer) via the external user
        auth service. Codes are used in the email verification and registration confirmation
        flows (assisted assurance mechanism).

        **HTTP 403 failure reasons (two distinct cases)**:
        1. `HAS_IDA_LINK` — person is already matched to an IDA identity (`isPersonMatched()`
           returns true). The caller must not attempt code generation.
        2. `HAS_ALREADY_REGISTERED_VIA_ASSISTED_ASSURANCE` — the external auth service
           rejected the code creation because the person has already registered through
           assisted assurance (upstream HTTP 403 from `registrationCodeClient`).

        HTTP 404 if person not found. HTTP 500 on DAO or upstream exception.
      operationId: 'generateRegistrationCodeForCustomer'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'personId'
          in: 'path'
          description: 'Internal party identifier.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Registration code string. Wrapped in CapdResponse with `_data` key.'
          content:
            application/json:
              schema:
                type: 'string'
                description: 'The generated registration code value.'
        '403':
          description: 'Person already has an IDA link, or has already registered via assisted assurance. Response body contains a CapdResponse wrapping a string failure-reason code (`HAS_IDA_LINK` or `HAS_ALREADY_REGISTERED_VIA_ASSISTED_ASSURANCE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Person not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Service exception.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
