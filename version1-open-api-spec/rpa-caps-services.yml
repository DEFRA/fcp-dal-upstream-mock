    OrganisationDetailsRequest:
      type: 'object'
      description: |
        Business contact details update request (used by PUT /organisation/{organisationId}/business-details).
        All-or-nothing atomic validation: every field must be valid before any DB write.

        Field constraints:
        - name: max 160 chars
        - email, correspondenceEmail: max 254 chars each
        - landline, mobile, correspondenceLandline, correspondenceMobile: max 50 chars each
        - taxRegistrationNumber: exactly 9 numeric digits (pattern ^[0-9]{9}$); conditionally required (required when businessType ≠ AGENCY)
        - address / correspondenceAddress: PartyAddressRequest — see UPRN vs manual mode
      properties:
        name:
          type: 'string'
          maxLength: 160
        businessType:
          $ref: '#/components/schemas/ReferenceDataItem'
        taxRegistrationNumber:
          type: 'string'
          minLength: 9
          maxLength: 9
          pattern: '^[0-9]{9}$'
          description: 'Required when businessType ≠ AGENCY. Exactly 9 numeric digits.'
        landline:
          type: 'string'
          maxLength: 50
        mobile:
          type: 'string'
          maxLength: 50
        email:
          type: 'string'
          maxLength: 254
        correspondenceLandline:
          type: 'string'
          maxLength: 50
        correspondenceMobile:
          type: 'string'
          maxLength: 50
        correspondenceEmail:
          type: 'string'
          maxLength: 254
        address:
          $ref: '#/components/schemas/PartyAddressRequest'
        correspondenceAddress:
          $ref: '#/components/schemas/PartyAddressRequest'
        isFinancialToBusinessAddr:
          type: 'boolean'
        isCorrespondenceAsBusinessAddr:
          type: 'boolean'
    AdditionalBusinessDetailsRequest:
      type: 'object'
      description: 'Additional business details update request.'
      properties:
        legalStatus:
          $ref: '#/components/schemas/ReferenceDataItem'
        businessType:
          $ref: '#/components/schemas/ReferenceDataItem'
        companiesHouseNumber:
          type: 'string'
        charityCommissionNumber:
          type: 'string'
        farmingStartDate:
          type: 'string'
          format: 'date'
    PartyNoteRequest:
      type: 'object'
      description: |
        Note/reason payload for state-transition endpoints (deactivate, lock, unlock, reactivate).
        Both `reason` and `note` are required and must be non-empty.
      properties:
        reason:
          type: 'string'
          description: 'Reason for the state change. Required, must not be blank.'
        note:
          type: 'string'
          description: 'Additional note. Required, must not be blank.'
        partyNoteType:
          type: 'string'
          description: |
            Note type discriminator. Must match the endpoint:
            - DeactivateOrganisation / DeactivatePerson
            - LockOrganisation / LockPerson
            - UnlockOrganisation / UnlockPerson
            - ReactivateOrganisation / ReactivatePerson
      required:
        - 'reason'
        - 'note'
    PartySearchRequest:
      type: 'object'
      description: 'Search request for parties (persons or organisations).'
      properties:
        primarySearchPhrase:
          type: 'string'
          description: 'Primary search term. Format must match searchFieldType.'
        searchFieldType:
          type: 'string'
          description: |
            Determines how primarySearchPhrase is interpreted.
            SBI type requires the phrase to match ^[1-9][0-9]{8,9} pattern.
          enum:
            - 'SBI'
            - 'BUSINESS_NAME'
            - 'TRADER_NUMBER'
            - 'VENDOR_NUMBER'
            - 'CUSTOMER_NAME'
            - 'CUSTOMER_REFERENCE'
            - 'PERSONAL_IDENTIFIER'
            - 'CUSTOMER_POSTCODE'
            - 'BUSINESS_POSTCODE'
        page:
          type: 'integer'
          format: 'int32'
          default: 1
          minimum: 1
        pageSize:
          type: 'integer'
          format: 'int32'
          default: 20
          minimum: 1
    ReferenceDataItem:
      type: 'object'
      description: 'Reference data item with ID and optional name.'
      properties:
        id:
          type: 'integer'
          format: 'int64'
          description: 'Reference data identifier.'
        name:
          type: 'string'
          description: 'Human-readable name.'
    OrganisationIsDuplicatesCheckResponse:
      type: 'object'
      description: |
        Result of a duplicate organisation check. Source: OrganisationIsDuplicatesCheckResponse.java.
        The two map properties use org party IDs as keys and SBI values as map values.
      properties:
        duplicate:
          type: 'boolean'
          description: 'True if any duplicate organisations were found.'
        duplicateOrgIdsAndSbis:
          type: 'object'
          description: 'Map of duplicate organisation party IDs (as string keys) to their SBI values. Organisations that are potential duplicates but do not yet have an open case.'
          additionalProperties:
            type: 'integer'
            format: 'int64'
        caseDuplicates:
          type: 'object'
          description: 'Map of organisation party IDs (as string keys) to their SBI values for duplicates that already have an open duplicate case.'
          additionalProperties:
            type: 'integer'
            format: 'int64'
