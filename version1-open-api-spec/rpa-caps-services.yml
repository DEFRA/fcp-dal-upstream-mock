openapi: '3.0.1'
info:
  title: 'RPA CAPD Services'
  version: '1.0'
  x-source-repository: capd-services
  description: |
    Core CAPD service exposing party (person and organisation) management, case management,
    alerts, MDM data loading, authorisation, authentication and reference data.

    **Authentication**: All endpoints that identify the caller use the `callerId` header,
    which acts as an API key identifying the service or user making the request. This is
    formalised below as the `CallerIdAuth` security scheme.

    **Validation flow**: Requests pass through four layers of validation:
    1. Path/query parameter binding (JAX-RS)
    2. Bean validation (JSR-303 `@Valid`)
    3. Service-layer business rules (explicit Java code)
    4. JPA domain model constraints (`@Size`, `@NotNull`, custom `@PostCode`)

    A failure at any layer returns the documented HTTP error code. For organisation and person
    write operations the transaction is atomic — if any field fails validation, even an unchanged
    field, the entire request is rejected.

    **Downstream dependencies**: SitiAgri and MDM failures are translated to HTTP error codes;
    they are not propagated raw to consumers.

    **IMPORTANT — HTTP 200 + error body pattern**: MDM data-load endpoints (`/mdm-data-load/*`)
    return **HTTP 200 for both success AND logical failures**. The response body contains a
    `result` field: `"OK"` for success, `"ERROR"` with an error message for logical failures.
    Only infrastructure/transport failures return HTTP 500. Consumers of MDM endpoints **must**
    inspect the `result` field — they cannot rely on HTTP status codes alone.

    **Empty body responses**: Some endpoints (e.g. `GET /alerts/{alertId}`, `GET /eoi/{sbi}`)
    return HTTP 200 with an empty response body when no record is found, rather than HTTP 404.
    Consumers must handle empty 200 responses gracefully.

    **x-validation-source**: Where constraints are documented from source evidence the
    `x-validation-source` extension on schemas cites the relevant Java file.
servers:
  - url: 'http://localhost:8080'
    description: 'Default Dropwizard port (production port not confirmed)'
tags:
  - name: 'auth'
  - name: 'agent'
  - name: 'alerts'
  - name: 'authorisation'
  - name: 'case-management'
  - name: 'digital-party'
  - name: 'eoi'
  - name: 'feedback'
  - name: 'gdpr'
  - name: 'ida-alternative'
  - name: 'internal-user'
  - name: 'mdm-data-load'
  - name: 'notification'
  - name: 'organisation'
  - name: 'party'
  - name: 'person-matches'
  - name: 'person'
  - name: 'reference'
  - name: 'validate-email-service'
  - name: 'verify-email'
paths:
  /auth/validate:
    get:
      tags:
        - 'auth'
      summary: 'Validate token (GET).'
      description: |
        Validates the caller's session token via the ExternalTokenHandler. The token is
        looked up from the session context derived from `callerId`. If no matching user
        context is found or the token is invalid, HTTP 401 is returned. On success returns
        a plain-text string containing callerId, userType, and tokenType values.
      operationId: 'validateTokenGET'
      security:
        - CallerIdAuth: []
      responses:
        '200':
          description: 'Token valid. Returns callerId, userType and tokenType as plain text.'
          content:
            text/plain:
              schema:
                type: 'string'
                example: 'callerId=12345,userType=external,tokenType=bearer'
        '401':
          description: 'User context not found or token invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - 'auth'
      summary: 'Validate token (POST).'
      description: |
        POST variant of token validation. Accepts form-encoded data and applies the same
        ExternalTokenHandler lookup as the GET variant. HTTP 401 if context not found.
      operationId: 'validateTokenPOST'
      security:
        - CallerIdAuth: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: 'object'
      responses:
        '200':
          description: 'Token valid. Returns callerId, userType and tokenType as plain text.'
          content:
            text/plain:
              schema:
                type: 'string'
        '401':
          description: 'User context not found or token invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /status:
    get:
      tags:
        - 'reference'
      summary: 'Application health check.'
      description: |
        Simple liveness probe. Returns a plain-text string when the application is running.
        Source: ApplicationStatusResource.java line 17 (absent from original OpenAPI specification).
      operationId: 'getStatus'
      responses:
        '200':
          description: 'Application is healthy.'
          content:
            text/plain:
              schema:
                type: 'string'
                example: 'OK'
  /forgotten-crn/send-crn:
    post:
      tags:
        - 'reference'
      summary: 'Send forgotten CRN to customer.'
      description: |
        Triggers a CRN reminder email to the customer containing their Customer Reference
        Number. Source: CapdForgottenCRNResource.java / PersonForgottenCRNService.java.

        **Lookup logic (two-stage)**:
        1. Person is first looked up by `email`. If found, the supplied `firstname`,
           `lastname`, and `postcode` must match the stored values (case-insensitive).
        2. If no person is found by email, a fallback lookup is performed using
           `firstname` + `lastname`. The result is then filtered by `postcode`. The
           fallback fails (HTTP 404) if zero or more than one person matches.

        **Failure conditions**:
        - HTTP 401 — supplied details do not match the person's stored record (wrong
          name, postcode, or email mismatch against existing email contact).
        - HTTP 403 — matched person is an internal (RPA staff) user, not a customer.
        - HTTP 404 — person not found; zero or multiple postcode matches in fallback
          lookup; email address or customer reference not recorded against the person.
        - HTTP 500 — downstream email service failure.
      operationId: 'sendForgottenCrn'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'firstname'
          in: 'query'
          description: 'Customer first name. Used to look up or verify the person record.'
          required: false
          schema:
            type: 'string'
        - name: 'lastname'
          in: 'query'
          description: 'Customer last name. Used to look up or verify the person record.'
          required: false
          schema:
            type: 'string'
        - name: 'email'
          in: 'query'
          description: |
            Customer email address. Primary lookup key. If a person with this email exists,
            name/postcode are validated against the stored record.
          required: false
          schema:
            type: 'string'
        - name: 'postcode'
          in: 'query'
          description: 'Customer postcode. Used for verification and fallback name+postcode lookup.'
          required: false
          schema:
            type: 'string'
      responses:
        '200':
          description: 'CRN reminder email sent successfully. Response body is empty.'
        '401':
          description: "Supplied details do not match the person's stored record."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Action forbidden — matched person is an internal user, not a customer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Person not found, zero/multiple postcode matches in fallback lookup, or email/CRN not recorded against the matched person.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Email service failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /forgotten-crn/crn/{personId}:
    delete:
      tags:
        - 'reference'
      summary: 'Delete forgotten CRN record.'
      description: |
        Removes a forgotten CRN record for the given person. Source:
        CapdForgottenCRNResource.java line 84 (absent from original OpenAPI specification).
      operationId: 'deleteForgottenCrn'
      parameters:
        - name: 'personId'
          in: 'path'
          description: 'Internal party identifier of the person whose forgotten-CRN record should be deleted.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Forgotten CRN record deleted.'
          content:
            application/json:
              schema:
                type: 'object'
  /agent/{organisationId}/business-type:
    get:
      tags:
        - 'agent'
      summary: 'Get business type for organisation.'
      description: |
        Returns the business type string for the given organisation. Wrapped in a CapdResponse
        envelope on the wire.
      operationId: 'getBusinessType'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'Internal party identifier of the organisation.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Business type string. Wrapped in CapdResponse.'
          content:
            application/json:
              schema:
                type: 'string'
  /agent/agency/{agencyId}:
    get:
      tags:
        - 'agent'
      summary: 'Find agents by agency ID.'
      description: |
        Returns all agents belonging to the given agency organisation. Requires the caller
        to have appropriate permissions; HTTP 403 is returned if permissions are insufficient.
      operationId: 'findAgentsByAgencyId'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'agencyId'
          in: 'path'
          description: 'Internal party identifier of the agency.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'List of agents. Wrapped in CapdResponse.'
          content:
            application/json:
              schema:
                type: 'array'
                items:
                  $ref: '#/components/schemas/AgentResponse'
        '404':
          description: 'No agents found for this agency.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Caller does not have permission to query agents for this agency.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alerts/create/image:
    post:
      tags:
        - 'alerts'
      summary: 'Upload alert image.'
      description: |
        Accepts a multipart/form-data upload of an alert image and returns the new image ID.

        **Required multipart parts:**
        - `fileSizeBytes`: the size of the image in bytes (numeric string). Missing → HTTP 400.
        - `image`: the base64-encoded image data. Missing → HTTP 400.

        **Image format validation** (applied to the `image` part content-type prefix):
        - Must be one of: `data:image/png;base64,`, `data:image/jpg;base64,`, `data:image/jpeg;base64,`
        - Any other prefix → HTTP 400 with message "image is not PNG OR JPG"

        **Size limit**: `fileSizeBytes` must not exceed the configured maximum (typically 20 KB raw,
        approximately 26 KB after base64 encoding). Exceeding the limit → HTTP 400.

        **Processing errors**: Failure to read the 22-byte base64 prefix or any stream
        processing error → HTTP 500.
      operationId: 'createImage'
      security:
        - CallerIdAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: 'object'
              required:
                - 'fileSizeBytes'
                - 'image'
              properties:
                fileSizeBytes:
                  type: 'integer'
                  format: 'int64'
                  description: 'Size of the image in bytes. Must not exceed the configured maximum (~20 KB).'
                image:
                  type: 'string'
                  format: 'byte'
                  description: 'Base64-encoded image. Content-type prefix must be data:image/png;base64,, data:image/jpg;base64, or data:image/jpeg;base64,'
      responses:
        '200':
          description: 'Image created. Returns the new image ID.'
          content:
            application/json:
              schema:
                type: 'integer'
                format: 'int64'
        '400':
          description: 'Validation failure: image format is not PNG/JPG, a required part is missing, or file size exceeds maximum.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Stream read error or image persistence failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alerts/{id}/end:
    put:
      tags:
        - 'alerts'
      summary: 'Set alert end date.'
      description: |
        Ends an active alert by setting its end date. Alerts are otherwise immutable
        after creation. If `endDate` is omitted the service defaults to the current
        system time in epoch milliseconds.
      operationId: 'setEndDate'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'id'
          in: 'path'
          description: 'Alert identifier.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'endDate'
          in: 'query'
          description: 'End date as epoch milliseconds. If omitted, defaults to current system time.'
          required: false
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Alert end date updated.'
          content:
            application/json:
              schema:
                type: 'object'
        '404':
          description: 'Alert not found for the given ID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alerts/{id}/image:
    get:
      tags:
        - 'alerts'
      summary: 'Retrieve alert image.'
      description: 'Returns the raw binary image data associated with the given alert ID.'
      operationId: 'getImage'
      parameters:
        - name: 'id'
          in: 'path'
          description: 'Alert identifier.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Image binary data.'
          content:
            application/octet-stream:
              schema:
                type: 'string'
                format: 'byte'
        '404':
          description: 'No image found for the given alert ID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alerts:
    get:
      tags:
        - 'alerts'
      summary: 'Get alerts since timestamp.'
      description: |
        Returns all alerts created or updated since the given epoch-millisecond timestamp.
        If no alerts match, returns HTTP 200 with an empty response body (not HTTP 404).
        If `timestampMillis` is omitted, behaviour is determined by the service (may return all).
      operationId: 'getAlertSinceTime'
      parameters:
        - name: 'timestampMillis'
          in: 'query'
          description: 'Epoch milliseconds lower bound for alert retrieval.'
          required: false
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'List of alerts, or empty if none found since the given timestamp.'
          content:
            application/json:
              schema:
                type: 'array'
                items:
                  $ref: '#/components/schemas/Alert'
  /alerts/all:
    get:
      tags:
        - 'alerts'
      summary: 'Get all alerts (paged, internal users).'
      description: |
        Returns a paged list of all alerts for internal users to review. Response includes
        alert metadata but not the image data itself. Images are retrieved separately via
        GET /alerts/{id}/image. Default page is 1, default pageSize is 20.
      operationId: 'getAllAlerts'
      parameters:
        - name: 'page'
          in: 'query'
          required: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 1
            minimum: 1
        - name: 'pageSize'
          in: 'query'
          required: false
          schema:
            type: 'integer'
            format: 'int32'
            default: 20
            minimum: 1
      responses:
        '200':
          description: 'Paged list of alerts.'
          content:
            application/json:
              schema:
                type: 'array'
                items:
                  $ref: '#/components/schemas/Alert'
  /alerts/{id}:
    get:
      tags:
        - 'alerts'
      summary: 'Get single alert.'
      description: 'Returns a single alert by ID for internal user preview.'
      operationId: 'getAlert'
      parameters:
        - name: 'id'
          in: 'path'
          description: 'Alert identifier. Must be 1–20 digits.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Single alert detail.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '404':
          description: 'Alert not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alerts/create:
    post:
      tags:
        - 'alerts'
      summary: 'Create alert.'
      description: |
        Creates a new alert. The image must already exist (created via POST /alerts/create/image)
        and its ID is supplied in the request body.

        **Validation rules:**
        - `alert` body must not be null → HTTP 400
        - `imageId` must not be null → HTTP 400
        - `altText` must not be null → HTTP 400
        - `altText` must be at least 10 characters → HTTP 400 ("alert text length less than 10")

        On success returns the new alert ID as an integer.
      operationId: 'createAlert'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertCreateRequest'
      responses:
        '200':
          description: 'Alert created. Returns the new alert ID.'
          content:
            application/json:
              schema:
                type: 'integer'
                format: 'int64'
        '400':
          description: 'Validation failure: null body, missing imageId, missing altText, or altText shorter than 10 characters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alerts/{id}/duplicate/{startTimeMillis}:
    post:
      tags:
        - 'alerts'
      summary: 'Duplicate an existing alert.'
      description: |
        Creates a new alert by copying the referenced existing alert (including its image),
        setting the new start time to `startTimeMillis`. If the referenced alert or image
        does not exist, HTTP 500 is returned.
      operationId: 'duplicateAlert'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'id'
          in: 'path'
          description: 'ID of the existing alert to duplicate.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'startTimeMillis'
          in: 'path'
          description: 'Start time for the new duplicate alert, as epoch milliseconds.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'Duplicate alert created. Returns the new alert ID.'
          content:
            application/json:
              schema:
                type: 'integer'
                format: 'int64'
        '500':
          description: 'Referenced alert or image not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /authorisation/organisation/{organisationId}:
    get:
      tags:
        - 'authorisation'
      summary: 'Find authorised people by organisation ID.'
      description: |
        Returns a list of AuthorisedPerson objects linked to the given organisation.
        HTTP 404 if the organisation ID does not exist.
        HTTP 403 if an error occurs while retrieving authorised persons (permission-related
        failures are reported as 403 rather than 500).
      operationId: 'findPeopleByOrganisationId'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'Internal party identifier of the organisation.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      responses:
        '200':
          description: 'List of authorised persons for this organisation.'
          content:
            application/json:
              schema:
                type: 'array'
                items:
                  $ref: '#/components/schemas/AuthorisedPerson'
        '404':
          description: 'Organisation ID does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Error occurred while retrieving authorised persons (permissions issue).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /authorisation/customer/{searchValue}:
    get:
      tags:
        - 'authorisation'
      summary: 'Find person by CRN or personal identifier.'
      description: |
        Searches for a person using a Customer Reference Number (CRN) or a Personal Identifier.
        The service attempts both lookups; if `searchValue` is neither a valid CRN format nor a
        valid personal identifier format, HTTP 400 is returned. HTTP 404 if no person found.
      operationId: 'findPeopleBySearchValue'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'searchValue'
          in: 'path'
          description: 'A Customer Reference Number (CRN) or Personal Identifier. Must be a valid format for one of these types.'
          required: true
          schema:
            type: 'string'
      responses:
        '200':
          description: 'Person summary.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSummaryResponse'
        '400':
          description: 'searchValue is not a valid CRN and not a valid personal identifier.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Person not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /authorisation/organisation/{organisationId}/agents:
    put:
      tags:
        - 'authorisation'
      summary: 'Assign agent firm to organisation.'
      description: |
        Assigns an agent firm (agency organisation) to the given organisation.
        **Constraint**: An agent firm cannot be assigned to another agent firm. Attempting to
        do so returns HTTP 500 with an explanatory message.
        HTTP 404 if the target organisation is not found.
      operationId: 'assignAgencyToOrganisation'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'organisationId'
          in: 'path'
          description: 'Internal party identifier of the organisation to assign the agent to.'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentAssignRequest'
      responses:
        '200':
          description: 'Agency assigned to organisation.'
        '404':
          description: 'Organisation not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Cannot assign an agent firm to another agent firm.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /authorisation/user:
    post:
      tags:
        - 'authorisation'
      summary: 'Find person ID by email.'
      description: |
        Returns the person ID for the given email address. Returns 0 if no person is found
        (not HTTP 404). HTTP 422 if multiple persons share the same email address.
      operationId: 'findByEmail'
      security:
        - CallerIdAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: 'string'
              description: 'Email address to look up.'
      responses:
        '200':
          description: 'Person ID, or 0 if not found.'
          content:
            application/json:
              schema:
                type: 'integer'
                format: 'int64'
        '422':
          description: 'More than one person found with this email address.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /authorisation/crn:
    post:
      tags:
        - 'authorisation'
      summary: 'Find person ID by CRN.'
      description: |
        Returns the person ID for the given Customer Reference Number. Returns 0 if not found.
        HTTP 422 if multiple persons share the same CRN (data integrity issue).
      operationId: 'findByCrn'
      security:
        - CallerIdAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: 'string'
              description: 'Customer Reference Number (CRN) to look up.'
      responses:
        '200':
          description: 'Person ID, or 0 if not found.'
          content:
            application/json:
              schema:
                type: 'integer'
                format: 'int64'
        '422':
          description: 'More than one person found with this CRN.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /case-management/case/{caseId}/assignCase/{personId}:
    put:
      tags:
        - 'case-management'
      summary: 'Assign case to new owner.'
      description: |
        Transfers ownership of a case to the given person. Both `caseId` and `personId` are
        validated against the pattern `[0-9]{0,20}` (up to 20 digits).
        HTTP 404 if the case or person is not found.
        HTTP 500 on DAO or downstream retrieval failure.
      operationId: 'updateCaseOwner'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'caseId'
          in: 'path'
          description: 'Case identifier (up to 20 digits).'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
        - name: 'personId'
          in: 'path'
          description: 'Person identifier of new case owner (up to 20 digits).'
          required: true
          schema:
            type: 'integer'
            format: 'int64'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: 'object'
      responses:
        '200':
          description: 'Case ownership updated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '404':
          description: 'Case or person not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'DAO exception or downstream retrieval failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /case-management/case/{caseId}:
    get:
      tags:
        - 'case-management'
      summary: 'Get case detail.'
