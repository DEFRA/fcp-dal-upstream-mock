      summary: 'Update digital party contact.'
      description: |
        Updates a digital (email) contact for a party. Requires both `callerId` and `userType`
        headers to be present; missing authentication fields → HTTP 401.
        HTTP 404 if the digital party contact record is not found.
        HTTP 500 if the update fails.
      operationId: 'patchDigitalParty'
      security:
        - CallerIdAuth: []
      parameters:
        - name: 'userType'
          in: 'header'
          description: 'User type context (internal, external, ida_no_match).'
          required: false
          schema:
            type: 'string'
            enum:
              - 'internal'
              - 'external'
              - 'ida_no_match'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyDigitalContactRequest'
      responses:
        '200':
          description: 'Digital contact updated.'
          content:
            application/json:
              schema:
                type: 'string'
        '401':
          description: 'Missing required authentication fields (callerId or userType).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Digital party contact not found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Digital party contact not updated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /eoi/{sbi}:
