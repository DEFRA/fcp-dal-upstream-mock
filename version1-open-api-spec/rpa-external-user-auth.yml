      description: Error response for POST /users. Extends ErrorResponse.
      properties:
        message:
          type: string
        error:
          type: string
        type:
          type: string
          enum:
            - INVALID_CUSTOMER_REFERENCE
            - LIMIT_EXCEEDED
            - REGISTRATION_CODE_NOT_FOUND
            - REGISTRATION_CODE_EXPIRED
            - INVALID_PASSWORD
            - ERROR
        remainingRegistrationAttempts:
          type: integer
          description: Remaining allowed registration attempts. Present when type=LIMIT_EXCEEDED.

    AuthenticationAttemptRequest:
      type: object
      x-validation-source: AuthenticationAttemptRequest.java (capd-external-user-auth-api)
      required:
        - password
      properties:
        password:
          type: string
          description: Plaintext password for bcrypt comparison. `@NotEmpty`.

    AuthenticationAttemptResponse:
      type: object
      x-validation-source: AuthenticationAttemptResponse.java (capd-external-user-auth-api)
      description: |
        Authentication result. Present in both 200 (OK) and 401/403 (failure) responses.
      properties:
        userStatus:
          type: string
          description: |
            Account status at the time of the authentication attempt:
            - `OK` — authenticated successfully
            - `INVALID_CREDENTIALS` — user not found or wrong password
            - `ACCOUNT_LOCKED` — account became locked due to this failed attempt (threshold just exceeded)
            - `ACCOUNT_LOCKED_ALREADY` — account was already locked before this attempt (correct password provided but account is locked)
            - `PASSWORD_EXPIRED` — password validity period exceeded (lastPasswordChange older than passwordValidityDays; also returned if lastPasswordChange is NULL)
          enum:
            - OK
            - INVALID_CREDENTIALS
            - ACCOUNT_LOCKED
            - ACCOUNT_LOCKED_ALREADY
            - PASSWORD_EXPIRED

    PersistUserSessionRequest:
