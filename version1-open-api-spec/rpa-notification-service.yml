      description: |
        Saves a new customer query to `CAPD_NOTIFICATION.CUSTOMER_QUERY` and posts it
        to the queue for CRM processing.

        **Returns**: BigInteger `queryId` of the created record.

        **Field constraints** (from `CUSTOMER_QUERY` entity):
        - `customerReference`: max 16, pattern `^[0-9]+$`, NOT NULL
        - `customerName`: max 300, NOT NULL
        - `businessName`: max 160, NOT NULL
        - `cc_subject`: max 100, NOT NULL
        - `permissions`: max 1000, NOT NULL
        - `esAgreementReference`: pattern `^AG[0-9]{8}$` (if provided)
        - `esClaimReferenceNumber`: pattern `^CL[0-9]{8,10}$` (if provided)
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerContactQueryRequest'
