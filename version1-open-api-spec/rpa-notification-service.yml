openapi: '3.0.1'
info:
  title: CAPD Notification Service
  version: v1
  x-source-repository: notification-service
  description: |
    Dropwizard / Hibernate / Jersey (JAX-RS) service managing portal notifications,
    bespoke (bulk SBI-targeted) notifications, customer contact (query/response) flows,
    and notification privilege management.

    **Database schema**: `CAPD_NOTIFICATION` (Oracle)
    - `NOTIFICATION` — individual portal notifications (soft-deleted via `deleted_at`)
    - `BESPOKE_NOTIFICATION` — admin-created bulk notifications with SBI target list
    - `PRIVILEGE` — privilege records for bespoke notifications
    - `CUSTOMER_QUERY` — customer contact queries
    - `CUSTOMER_COMMUNICATIONS` — responses/communications on queries
    - `CUSTOMER_CONTACT_PERMISSIONS`, `COUNTY`, `CUSTOMER_CONTACT_QUERY_TYPE`,
      `CUSTOMER_CONTACT_SUBJECT`, `CC_MATRIX_REL`, `CUSTOMER_CONTACT_QUEUE`,
      `CRM_QUEUE`, `CUSTOMER_CONTACT_GHOST_TEXT`, `MAPPING_CHANGES`

    **Audit**: Most tables are audited with Hibernate Envers (`@Audited`).
    Soft-delete on `NOTIFICATION` via `deleted_at` column with `@SQLRestriction("deleted_at is null")`.

    **Authentication/Authorisation**:
    - `callerId` and `userType` headers used for access control throughout.
    - Internal users (`UserType.internal`) have full access.
    - External users can only access their own resources (`callerId == personId`).
    - `SERVICES_CALLER_ID` (configured system service caller) has special batch privileges.
    - `@CapdInternalEndpoint(functions = "deactivatePerson")` on GDPR obfuscation endpoints.
    - `@CapdPersonAuthorisation` on `GET /notifications/`.

    **Undocumented endpoints** (not in original spec):
    - `GET /mapping-changes/{personId}/{notificationId}/{sheetId}/{parcelId}` — internal use

    **Status code corrections vs original spec**:
    - `PUT /notifications/{id}` returns **204** not 200 on success

servers:
  - url: http://localhost:8080
    description: Local Dropwizard development server

tags:
  - name: notifications
    description: Core notification CRUD and lifecycle management
  - name: bespoke-notifications
    description: Bulk admin-created notifications targeting SBI lists
  - name: privileges
    description: Privilege management for bespoke notifications
  - name: customer-contact
    description: Customer contact query and communication flows
  - name: mapping-changes
    description: Land parcel mapping change notifications (internal)
  - name: status
    description: Application health check

paths:
  /status:
    get:
      tags:
        - status
      summary: Application health check
      operationId: getStatus
      description: Returns plain text service status.
      responses:
        '200':
          description: Service is up
          content:
            text/plain:
              schema:
                type: string

  # ─────────────────────────────────────────────────────────
  # NotificationResource — @Path("/notifications")
  # ─────────────────────────────────────────────────────────

  /notifications:
    post:
      tags:
        - notifications
      summary: Create batch notifications
      operationId: createNotifications
      description: |
        Creates multiple `NOTIFICATION` records in a single request. Restricted to
        `SERVICES_CALLER_ID` (system service). Returns the IDs of the created records.

        **HTTP 403**: `callerId` header does not match `SERVICES_CALLER_ID` (configured value).

        Each `Notification` in the list is persisted to `CAPD_NOTIFICATION.NOTIFICATION`
        with `createdAt=now`.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Notifications created. Returns list of new IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationIdsResponse'
        '403':
          description: callerId is not SERVICES_CALLER_ID

    get:
      tags:
        - notifications
      summary: Get paginated notifications for a person
      operationId: getNotifications
      description: |
        Returns paginated notifications for the specified `personId` with optional filters.

        **Authorisation**: `@CapdPersonAuthorisation` — caller must have access to the person.
        Additionally, access check: internal user OR `callerId == personId`. HTTP 403 if denied.

        **HTTP 400**: `personId` query param missing.
        **HTTP 403**: Caller does not have permission to view this person's notifications.

        **Filter values** (`filter` param):
        - `archived` — only archived notifications (archivedAt IS NOT NULL)
        - `notArchived` — only non-archived notifications (default)
        - `notArchivedRead` — non-archived, already read
        - `notArchivedNotRead` — non-archived, unread
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: personId
          in: query
          required: true
          description: Person ID to retrieve notifications for. Required — HTTP 400 if missing.
          schema:
            type: integer
        - name: organisationId
          in: query
          required: false
          description: Optional filter by organisation ID
          schema:
            type: integer
        - name: filter
          in: query
          required: false
          description: |
            Filter type: `archived` | `notArchived` | `notArchivedRead` | `notArchivedNotRead`
          schema:
            type: string
            enum:
              - archived
              - notArchived
              - notArchivedRead
              - notArchivedNotRead
        - name: orderBy
          in: query
          required: false
          description: Sort order field
          schema:
            type: string
      responses:
        '200':
          description: Paginated notifications with read/unread counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '400':
          description: personId query param is missing
        '403':
          description: Caller does not have permission to access this person's notifications

    delete:
      tags:
        - notifications
      summary: Delete multiple notifications by ID
      operationId: deleteNotifications
      description: |
        Soft-deletes multiple notifications by setting `deleted_at`. Restricted to
        `SERVICES_CALLER_ID`.

        **HTTP 403**: `callerId` does not match `SERVICES_CALLER_ID`.
        **Returns HTTP 204** (No Content) on success.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: id
          in: query
          required: false
          description: One or more notification IDs to delete. Repeat param for multiple.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
      responses:
        '204':
          description: Notifications deleted (No Content)
        '403':
          description: callerId is not SERVICES_CALLER_ID

  /notifications/count:
    post:
      tags:
        - notifications
      summary: Get notification counts by organisation
      operationId: getNotificationCounts
      description: |
        Returns notification counts per organisation for the specified `personId`.

        **HTTP 400**: `personId` query param is missing.
        **HTTP 403**: Caller does not have access to this person's data.

        Body is a list of organisation IDs to count notifications for.
        Returns `HashMap<BigDecimal, NotificationCounts>` — keyed by organisationId.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: personId
          in: query
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        description: List of organisation IDs to query
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      responses:
        '200':
          description: Notification counts per organisation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/NotificationCounts'
        '400':
          description: personId query param missing
        '403':
          description: Access denied

  /notifications/weeklydigest:
    get:
      tags:
        - notifications
      summary: Trigger weekly digest email sending
      operationId: weeklyDigest
      description: |
        Triggers sending of weekly digest notification emails. Restricted to `SERVICES_CALLER_ID`.
        Checks the `NOTIFICATION` feature toggle is enabled before processing.

        **HTTP 403**: `callerId` does not match `SERVICES_CALLER_ID`.
        **HTTP 403**: NOTIFICATION feature toggle is disabled.

        Returns empty response body on success.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
      responses:
        '200':
          description: Weekly digest emails sent
        '403':
          description: callerId not SERVICES_CALLER_ID or NOTIFICATION feature toggle disabled

  /notifications/{id}:
    get:
      tags:
        - notifications
      summary: Get a notification by ID
      operationId: getNotificationById
      description: |
        Returns a single `NOTIFICATION` by primary key. Checks caller has permission to
        access the notification's `personId`.

        **HTTP 403**: Caller does not have permission to view this notification.
        **HTTP 404**: Notification not found.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: id
          in: path
          required: true
          description: Notification primary key (BigInteger)
          schema:
            type: integer
      responses:
        '200':
          description: Notification found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '403':
          description: Access denied for this notification's personId
        '404':
          description: Notification not found

    put:
      tags:
        - notifications
      summary: Update a notification
      operationId: updateNotification
      description: |
        Updates a `NOTIFICATION` record (e.g., set `readAt`, `archivedAt`). Verifies
        caller has access to the notification's `personId`.

        **HTTP 403**: Caller does not have permission to modify this notification.
        **HTTP 404**: Notification not found.
        **Returns HTTP 204** (No Content) on success.
        **NOTE**: Original spec states HTTP 200 — **actual source returns HTTP 204**.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: id
          in: path
          required: true
          description: Notification primary key (BigInteger)
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notification'
      responses:
        '204':
          description: 'Notification updated (No Content). NOTE: original spec says 200.'
        '403':
          description: Access denied
        '404':
          description: Notification not found

  /notifications/{personId}/all:
    delete:
      tags:
        - notifications
      summary: Delete all archived notifications for a person
      operationId: deleteAllArchivedForPerson
      description: |
        Hard-deletes all archived (`archivedAt IS NOT NULL`) notifications for `personId`.
        Checks caller has access to `personId`.

        **HTTP 204**: Success (No Content).
        **HTTP 403**: Access denied.
        **HTTP 404**: No archived notifications found (nothing deleted).
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: personId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: All archived notifications deleted
        '403':
          description: Access denied for this personId
        '404':
          description: No archived notifications found for this person

  /notifications/{personId}/restore-all:
    put:
      tags:
        - notifications
      summary: Restore all archived notifications for a person
      operationId: restoreAllArchivedForPerson
      description: |
        Clears `archivedAt` on all archived notifications for `personId`. Checks access.

        **HTTP 204**: Success.
        **HTTP 403**: Access denied.
        **HTTP 404**: No archived notifications found.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: personId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: All archived notifications restored
        '403':
          description: Access denied
        '404':
          description: No archived notifications found

  /notifications/{personId}/organisation/{organisationId}:
    delete:
      tags:
        - notifications
      summary: Delete all archived notifications for a person+organisation pair
      operationId: deleteAllArchivedForPersonAndOrg
      description: |
        Hard-deletes all archived notifications for `personId` AND `organisationId`.

        **HTTP 204**: Success.
        **HTTP 403**: Access denied.
        **HTTP 404**: Nothing to delete.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: personId
          in: path
          required: true
          schema:
            type: integer
        - name: organisationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted (No Content)
        '403':
          description: Access denied
        '404':
          description: Nothing found to delete

  /notifications/{personId}/restore/{organisationId}:
    put:
      tags:
        - notifications
      summary: Restore all archived notifications for a person+organisation pair
      operationId: restoreAllArchivedForPersonAndOrg
      description: |
        Clears `archivedAt` on all archived notifications for `personId` AND `organisationId`.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: personId
          in: path
          required: true
          schema:
            type: integer
        - name: organisationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Restored (No Content)
        '403':
          description: Access denied
        '404':
          description: No archived notifications found

  /notifications/{personId}/restore-one/{notificationId}:
    patch:
      tags:
        - notifications
      summary: Restore a single archived notification
      operationId: restoreOneNotification
      description: |
        Restores a single archived notification by clearing `archivedAt`. Validates that
        `personId` and `notificationId` match the values in the request body.

        **HTTP 403**: Access denied.
        **HTTP 404**: Notification not found.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: personId
          in: path
          required: true
          schema:
            type: integer
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Notification restored
        '403':
          description: Access denied
        '404':
          description: Notification not found

  /notifications/{personId}/one/{notificationId}:
    delete:
      tags:
        - notifications
      summary: Delete a specific notification (requires prior archiving)
      operationId: deleteOneNotification
      description: |
        Hard-deletes a specific notification for `personId`. The notification must be
        archived first (`archivedAt IS NOT NULL`).

        **HTTP 204**: Success.
        **HTTP 403**: Access denied.
        **HTTP 404**: Notification not found.
        **HTTP 422**: Notification is not yet archived (cannot delete unarchived notification).
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: personId
          in: path
          required: true
          schema:
            type: integer
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Notification deleted (No Content)
        '403':
          description: Access denied
        '404':
          description: Notification not found
        '422':
          description: Notification must be archived before it can be deleted

  /notifications/obfuscate/{personId}/{obfuscationId}:
    delete:
      tags:
        - notifications
      summary: GDPR obfuscation of notifications for a person
      operationId: obfuscateNotifications
      description: |
        Replaces `body` and `title` fields in `NOTIFICATION` records for `personId` with
        `obfuscationId`. Used in the person deactivation / GDPR erasure flow.

        **Authorisation**: `@CapdInternalEndpoint(functions = "deactivatePerson")` — requires
        internal endpoint access. HTTP 403 if missing.

        **HTTP 200**: Returns the count of obfuscated records as a String.
        **HTTP 500**: Internal error during obfuscation.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - name: personId
          in: path
          required: true
          description: Person ID whose notifications will be obfuscated
          schema:
            type: integer
        - name: obfuscationId
          in: path
          required: true
          description: Replacement string for PII fields (body, title)
          schema:
            type: string
      responses:
        '200':
          description: Obfuscation complete. Body is count of records obfuscated as a String.
          content:
            application/json:
              schema:
                type: string
        '403':
          description: Missing deactivatePerson internal endpoint privilege
        '500':
          description: Internal error during obfuscation

  # ─────────────────────────────────────────────────────────
  # BespokeNotificationResource — @Path("notifications/bespoke-notifications")
  # ─────────────────────────────────────────────────────────

  /notifications/bespoke-notifications/all:
    get:
      tags:
        - bespoke-notifications
      summary: Get all bespoke notifications (grouped by status)
      operationId: getAllBespokeNotifications
      description: |
        Returns all bespoke notifications from `BESPOKE_NOTIFICATION`, optionally filtered
        by `group` (default: "send"). Returns `BespokeNotificationListResponse` with list.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: group
          in: query
          required: false
          description: Group filter. Default "send".
          schema:
            type: string
            default: send
      responses:
        '200':
          description: List of bespoke notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BespokeNotificationListResponse'

  /notifications/bespoke-notifications/search:
    get:
      tags:
        - bespoke-notifications
      summary: Search bespoke notifications by keyword
      operationId: searchBespokeNotifications
      description: |
        Searches `BESPOKE_NOTIFICATION.subject` and `message` for the given keyword.
        Supports pagination.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: keyWord
          in: query
          required: false
          schema:
            type: string
        - name: group
          in: query
          required: false
          schema:
            type: string
            default: send
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BespokeNotificationListResponse'

  /notifications/bespoke-notifications/create:
    post:
      tags:
        - bespoke-notifications
      summary: Create a bespoke notification
      operationId: createBespokeNotification
      description: |
        Creates a new `BESPOKE_NOTIFICATION` record with associated `PRIVILEGE` records.
        Sets `createdBy=callerId`, `createdDate=now`, `isProcessed=false`.

        **HTTP 400**: Request body is null.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BespokeNotificationRequest'
      responses:
        '200':
          description: Bespoke notification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BespokeNotification'
        '400':
          description: Request body is null

  /notifications/bespoke-notifications/validate-file:
    post:
      tags:
        - bespoke-notifications
      summary: Validate an SBI list CSV file
      operationId: validateBespokeNotificationFile
      description: |
        Validates a multipart CSV file containing SBI (Single Business Identifier) numbers.

        **Validation rules**:
        - HTTP 400: Input stream is null
        - HTTP 404: File is empty (no content)
        - HTTP 413: File contains too many lines (exceeds configured maximum)
        - HTTP 422: File format invalid — each line must be a 9-digit numeric SBI
          (`[0-9]{9}`)

        **On success**: Returns HTTP 200 with the validated SBI count or list.
      parameters:
        - $ref: '#/components/parameters/callerId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file. One SBI (`[0-9]{9}`) per line.
      responses:
        '200':
          description: File is valid
        '400':
          description: Input stream is null
        '404':
          description: File is empty
        '413':
          description: File contains too many SBI entries (exceeds configured maximum)
        '422':
          description: File format invalid — each line must be a 9-digit numeric SBI

  /notifications/bespoke-notifications/add-file/{id}:
    post:
      tags:
        - bespoke-notifications
      summary: Upload SBI list to a bespoke notification
      operationId: addFileToBespokeNotification
      description: |
        Uploads a validated SBI list CSV and attaches it to `BESPOKE_NOTIFICATION.sbi`
        (stored as CLOB) for the given notification ID.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - name: id
          in: path
          required: true
          description: Bespoke notification primary key (BigInteger)
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file with SBI numbers (one per line)
      responses:
        '200':
          description: SBI list uploaded and stored

  /notifications/bespoke-notifications/process:
    get:
      tags:
        - bespoke-notifications
      summary: Get bespoke notifications ready for processing
      operationId: getBespokeNotificationsToProcess
      description: |
        Returns all `BESPOKE_NOTIFICATION` records where `isProcessed=false` and
        `sendDate <= timestamp`. Used by batch processing jobs.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - name: timestamp
          in: query
          required: false
          description: |
            Reference timestamp in format `yyyyMMddHHmmss`. Returns notifications
            with `sendDate` at or before this timestamp.
          schema:
            type: string
            pattern: '^\d{14}$'
          example: '20240115120000'
      responses:
        '200':
          description: List of bespoke notifications ready to process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BespokeNotificationListResponse'

  /notifications/bespoke-notifications/mark-processed:
    put:
      tags:
        - bespoke-notifications
      summary: Mark bespoke notifications as processed
      operationId: markBespokeNotificationsProcessed
      description: |
        Sets `isProcessed=true` on the specified `BESPOKE_NOTIFICATION` IDs.
        Used by batch processing jobs after successful notification dispatch.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
      requestBody:
        required: true
        description: List of bespoke notification IDs to mark as processed
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
      responses:
        '200':
          description: Notifications marked as processed

  /notifications/bespoke-notifications/{id}:
    get:
      tags:
        - bespoke-notifications
      summary: Get a bespoke notification by ID
      operationId: getBespokeNotificationById
      description: |
        Returns a single `BESPOKE_NOTIFICATION` by primary key.

        **HTTP 404**: Not found.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: id
          in: path
          required: true
          description: Bespoke notification primary key (BigInteger)
          schema:
            type: integer
      responses:
        '200':
          description: Bespoke notification found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BespokeNotification'
        '404':
          description: Bespoke notification not found

    put:
      tags:
        - bespoke-notifications
      summary: Update a bespoke notification
      operationId: updateBespokeNotification
      description: |
        Updates an existing `BESPOKE_NOTIFICATION` record and its associated privileges.

        **HTTP 400**: Request body is null.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: id
          in: path
          required: true
          description: Bespoke notification primary key (BigInteger)
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BespokeNotificationRequest'
      responses:
        '200':
          description: Bespoke notification updated
        '400':
          description: Request body is null

    delete:
      tags:
        - bespoke-notifications
      summary: Delete a bespoke notification
      operationId: deleteBespokeNotification
      description: |
        Deletes a `BESPOKE_NOTIFICATION` record and associated `PRIVILEGE` records.

        **HTTP 404**: Bespoke notification not found.
      parameters:
        - $ref: '#/components/parameters/callerId'
        - $ref: '#/components/parameters/userType'
        - name: id
          in: path
          required: true
